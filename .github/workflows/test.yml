name: Tests
# A pull request runs once per push (not once for the push and again for the pull request), and a newer push cancels the run it replaces. The default branch runs on every push
# and is never cancelled.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The jobs check out the code and run the tests, so they need to read the repository and nothing else.
permissions:
  contents: read
jobs:
  # The suite in four parts (node --test --test-shard), each on its own runner: the test files are separate processes, so a part needs nothing from the others.
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:shard
        env:
          SHARD: ${{ matrix.shard }}
  # One check for the four parts, under the name the suite has always had here, so a rule that requires "test" still has a check to wait for.
  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.shard.result }}" = success
  # The coverage floor (tools/coverage-floor.json): the suite again under the browser's coverage, in the same four parts, and then one job merges what the parts saw and
  # checks the floor. The merge job keeps the name `coverage`. Its own result is the floor, not the tests (the bundle test cannot pass in a coverage run).
  coverage-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run coverage -- --shard ${{ matrix.shard }} --into coverage-data
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: coverage-data
          retention-days: 1
  coverage:
    needs: coverage-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-parts
      # The parts' files are named by process, so two parts can share a name: the merge reads one directory, with the part in each name.
      - run: |
          mkdir coverage-all
          for part in coverage-parts/*/; do for f in "$part"*.json; do cp "$f" "coverage-all/$(basename "$part")-$(basename "$f")"; done; done
          ls coverage-all | wc -l
      - run: node tools/coverage.js --from coverage-all --check
