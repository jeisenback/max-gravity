name: Soak
# The distribution checks (npm run soak, tests/distribution/): the pacing and pay of the hired chapter, its danger, how the main characters are drawn and introduced.
# They depend on a spread over many random games and move whenever a new random draw shifts the stream, so they are not in the suite and not a check on a pull
# request: a red here is drift to look at, not a change to block. They run nightly on main, and by hand from the Actions page, one runner per file, since the
# heavy files each take a minute or two alone (the stakes are two files, each 120 chapters) and a runner has as many cores as they can use (tools/soak.js soaks).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        files: ['intros', 'pacing', 'stakes', 'stakes-fights', 'fights', 'cast-draw frequency']
    name: soak (${{ matrix.files }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node --test --test-reporter=tap --test-reporter-destination=stdout $(for f in ${{ matrix.files }}; do printf 'tests/distribution/%s.test.js ' "$f"; done)
