name: Set up the tests
description: Node, the npm packages and the browser the tests drive.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    # The browser is cached by the lockfile (it pins Playwright's version). Its system libraries are not installed (no --with-deps, no install-deps): the
    # hosted Ubuntu image already carries what Chromium needs, since it ships Chrome, and the apt step from the Ubuntu mirror could take over ten minutes
    # before any test ran (#817).
    - uses: actions/cache@v4
      id: browser
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - if: steps.browser.outputs.cache-hit != 'true'
      run: npx playwright install chromium
      shell: bash
