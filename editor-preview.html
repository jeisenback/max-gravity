<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Max Gravity: scene preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-role="preview">
  <!-- The game's page without its scripts: editor.js loads them (and the game), and keeps what the game stores in memory. -->
  <canvas id="game" role="img" aria-label="Game view."></canvas>
  <div id="panel" class="hidden"></div>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script src="editor.js"></script>
</body>
</html>
