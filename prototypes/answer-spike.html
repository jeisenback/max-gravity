<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat and Answer Spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Temporary prototype (prototypes/README.md). Layout: the radar and the ship in section side by side, sticky on the left; the post's console on the right. */
:root {
  --bg: #060a10; --panel: #0b121c; --raised: #111b29; --line: #1d2d41;
  --fg: #d4e2f0; --dim: #7a8ea6; --accent: #7fb4ff; --hot: #ff6a4a; --warm: #ffd27f; --ok: #7bd59d;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; --sans: 'IBM Plex Sans', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 430px); gap: 16px; max-width: 1500px; margin: 0 auto; padding: 16px; }
@media (max-width: 1000px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.view { position: sticky; top: 16px; align-self: start; display: grid; gap: 10px; min-width: 0; }
canvas { display: block; width: 100%; aspect-ratio: 1.6 / 1; border: 1px solid var(--line); border-radius: 4px; background: #050a11; }
.legend { font: 12px/1.5 var(--mono); color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
h1 { margin: 0; font: 600 15px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.sub, .note { margin: 0; color: var(--dim); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab { font: 11px var(--mono); color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; min-width: 64px; }
button { font: 500 12px var(--mono); background: var(--raised); border: 1px solid var(--line); color: var(--fg); padding: 6px 10px; border-radius: 3px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg.col { flex-direction: column; align-items: stretch; }
.seg button { position: relative; padding-left: 24px; background: transparent; color: var(--dim); text-align: left; }
.seg button::before { content: ""; position: absolute; left: 8px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border: 1px solid var(--dim); border-radius: 50%; }
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--raised); border-color: var(--accent); }
.seg button[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.seg button .tag { color: var(--ok); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.go { font-size: 14px; padding: 10px; background: #16304f; border-color: var(--accent); width: 100%; letter-spacing: 0.06em; }
.read { font: 13px/1.5 var(--mono); margin: 0; }
.bad { color: var(--hot); } .good { color: var(--ok); } .warm { color: var(--warm); }
.threat { margin: 0; padding: 8px 10px; background: #1a0f10; border-left: 2px solid var(--hot); font: 13px/1.55 var(--mono); }
.threat b { color: var(--hot); }
.summary { margin: 0; padding: 8px 10px; background: var(--raised); border-left: 2px solid var(--accent); font: 13px/1.55 var(--mono); }
.summary b { color: var(--accent); }
details > summary { cursor: pointer; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
details[open] > summary { margin-bottom: 10px; }
details > div { display: grid; gap: 10px; }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 100px; }
.crew { display: grid; gap: 4px; font: 12px var(--mono); }
.crew div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; }
.strip { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; font: 12px/1.45 var(--mono); }
.strip div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; }
.strip time { color: var(--dim); } .strip .ev { color: var(--dim); }
.over { border-color: var(--accent); } .over p { margin: 0; font: 500 14px var(--mono); }
ul.q { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; display: grid; gap: 4px; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <section class="view">
    <canvas id="cv" aria-label="The radar with her and what she will do this turn, and the Ice Hauler in section with her damage and who is where"></canvas>
    <div class="legend"><span><b style="color:#ff6a4a">red</b> what she will do this turn</span><span><b style="color:#7fb4ff">blue</b> how the crew answer</span><span><b style="color:#ffd27f">yellow</b> your answer</span><span>rooms: amber damaged, red out</span></div>
  </section>
  <aside class="side" id="side"></aside>
</div>
<script>
'use strict';
// Temporary prototype: she declares what she will do; each post answers with one action from its own list, at odds shown; hits land on rooms.
const K = { TURNS: 10, BROADSIDE: 10, TORP: 16, SHIELD: 0.6, GUN: 12, CREW_LVL: 2 };
const BANDS = ['knife', 'close', 'mid', 'long'], BAND_KM = [2, 8, 20, 38];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = x => Math.round(x * 100);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- the ship: the Ice Hauler's rooms (js/layouts.js); five hold a system that a hit can damage ----------
const ROOMS = [
  { id: 'bridge', name: 'Bridge', deck: 0, x0: 0, x1: 1, sys: 'helm and sensors' },
  { id: 'galley', name: 'Galley', deck: 1, x0: 0, x1: 0.48 }, { id: 'head', name: 'Head', deck: 1, x0: 0.52, x1: 1 },
  { id: 'berths', name: 'Berths', deck: 2, x0: 0, x1: 1 },
  { id: 'gunnery', name: 'Gunnery', deck: 3, x0: 0, x1: 0.48, sys: 'gun' }, { id: 'workshop', name: 'Workshop', deck: 3, x0: 0.52, x1: 1, sys: 'damage control' },
  { id: 'airlock', name: 'Airlock', deck: 4, x0: 0, x1: 0.48, sys: 'lock' }, { id: 'medbay', name: 'Medbay', deck: 4, x0: 0.52, x1: 1 },
  { id: 'plant', name: 'Life support', deck: 5, x0: 0, x1: 1 },
  { id: 'engine', name: 'Engine', deck: 6, x0: 0, x1: 0.48, sys: 'drive' }, { id: 'hold', name: 'Hold', deck: 6, x0: 0.52, x1: 1 },
];
const ROOM = Object.fromEntries(ROOMS.map(r => [r.id, r]));
const POSTS = {
  gunner: { crew: 'Cato', room: 'gunnery', rooms: ['gunnery'] },
  pilot: { crew: 'Ines', room: 'bridge', rooms: ['bridge', 'engine'] },
  engineer: { crew: 'Tomas', room: 'engine', rooms: ['engine', 'workshop'] },
  comms: { crew: 'Hester', room: 'bridge', rooms: ['bridge'] },
};
// What each post can do. `answers` names the threats an action is an answer to, shown beside it.
const ACTS = {
  gunner: [
    { id: 'broadside', label: 'Broadside at her hull', base: 0.6, answers: [] },
    { id: 'aim-launcher', label: 'Aimed shot at her launcher', base: 0.42, answers: ['arm', 'salvo'] },
    { id: 'aim-lock', label: 'Aimed shot at her grapple', base: 0.42, answers: ['board'] },
    { id: 'aim-guns', label: 'Aimed shot at her guns', base: 0.42, answers: ['broadside'] },
    { id: 'pdc', label: 'PDC screen', base: 0.65, answers: ['salvo'] },
    { id: 'suppress', label: 'Suppressing fire', base: 0.65, answers: ['broadside'] },
  ],
  pilot: [
    { id: 'evade', label: 'Evade', base: 0.6, answers: ['broadside', 'salvo'] },
    { id: 'open', label: 'Open the range', base: 0.55, answers: ['close', 'board'] },
    { id: 'close', label: 'Close the range', base: 0.6, answers: ['break'] },
    { id: 'flank', label: 'Swing for a flank shot', base: 0.5, answers: [] },
  ],
  engineer: [
    { id: 'shields', label: 'Power to the shields', base: 0.7, answers: ['broadside', 'salvo'] },
    { id: 'guns', label: 'Power to the gun', base: 0.7, answers: [] },
    { id: 'repair', label: 'Damage control', base: 0.55, answers: [] },
  ],
  comms: [
    { id: 'jam', label: 'Jam her torpedoes', base: 0.55, answers: ['salvo'] },
    { id: 'spoof', label: 'Spoof her grapple', base: 0.5, answers: ['board'] },
    { id: 'scan', label: 'Scan her', base: 0.7, answers: [] },
  ],
};
const ACT = Object.fromEntries(Object.entries(ACTS).flatMap(([p, l]) => l.map(a => [a.id, { ...a, post: p }])));
const THREAT = { arm: 'arming a salvo', salvo: 'a torpedo salvo', broadside: 'a broadside', close: 'closing the range', board: 'a grapple at your lock', break: 'breaking off' };
const UI = { post: 'gunner', level: 2, trust: 0.5, nerve: 0.5, veteran: false, seed: 3, setupOpen: false };
let S;

function newGame(seed) {
  const s = { seed, r: mulberry(seed), turn: 0, band: 3, hull: 100, rooms: { bridge: 2, gunnery: 2, workshop: 2, airlock: 2, engine: 2 }, flank: false, scanned: false,
    foe: { hull: 80, max: 80, guns: 2, launcher: 1, lock: 1, torps: 4, armed: false }, log: [], fx: [], over: null, mine: null, stance: 'steady', by: null, used: false };
  startTurn(s); return s;
}
const lvl = post => post === UI.post ? UI.level : K.CREW_LVL;
const roomPen = (s, post) => Math.max(...POSTS[post].rooms.map(id => [0.35, 0.15, 0][s.rooms[id]]));
function odds(s, id) {
  const a = ACT[id]; let p = a.base + 0.07 * (lvl(a.post) - 2) - roomPen(s, a.post) + (s.scanned ? 0.08 : 0);
  if (a.post === 'gunner' && id !== 'pdc') p += [0.15, 0.1, 0, -0.15][s.band] + (s.flank ? 0.15 : 0) + (s.stance === 'aggressive' ? 0.05 : 0);
  if (id === 'evade' || id === 'shields') p += s.stance === 'defensive' ? 0.05 : s.stance === 'aggressive' ? -0.05 : 0;
  if ((id === 'aim-launcher' && !s.foe.launcher) || (id === 'aim-lock' && !s.foe.lock) || (id === 'aim-guns' && !s.foe.guns)) return 0;
  return clamp(p, 0.05, 0.95);
}
function log(s, who, text, kind = 'call') { s.log.unshift({ t: `T${s.turn + 1}`, who, text, kind }); if (s.log.length > 80) s.log.pop(); }

// ---------- her: what she declares, and (a veteran, sometimes) what she really does ----------
function herIntent(s) {
  const f = s.foe;
  if (f.hull / f.max < 0.3) return { kind: 'break' };
  if (f.armed) return { kind: 'salvo', n: Math.min(2, f.torps) };
  if (f.launcher && f.torps && s.turn % 3 === 0) return { kind: 'arm' };
  if (f.lock && s.band <= 1) return { kind: 'board' };
  if (f.lock && s.band > 1 && s.r() < 0.4) return { kind: 'close' };
  if (f.guns) { const hurt = s.lastHurtBy === 'gunner' ? 'gunnery' : ['gunnery', 'bridge', 'engine'][Math.floor(s.r() * 3)]; return { kind: 'broadside', room: hurt }; }
  return { kind: 'close' };
}
// ---------- the captain's stance, and the crew's answers ----------
function stancePick(s) { const ours = s.hull / 100, hers = s.foe.hull / s.foe.max; if (hers < ours - 0.25 || UI.nerve > 0.7) return 'aggressive'; if (ours < 0.5 && UI.nerve < 0.6) return 'defensive'; return 'steady'; }
const AI = {
  salvo: { gunner: 'pdc', pilot: 'evade', engineer: 'shields', comms: 'jam' },
  arm: { gunner: 'aim-launcher', pilot: 'flank', engineer: 'guns', comms: 'scan' },
  broadside: { gunner: 'broadside', pilot: 'evade', engineer: 'shields', comms: 'scan' },
  close: { gunner: 'broadside', pilot: 'open', engineer: 'guns', comms: 'scan' },
  board: { gunner: 'aim-lock', pilot: 'open', engineer: 'guns', comms: 'spoof' },
  break: { gunner: 'broadside', pilot: 'close', engineer: 'guns', comms: 'scan' },
};
function crewPick(s, post) {
  let a = AI[s.shown.kind][post];
  if (post === 'engineer' && Object.values(s.rooms).some(v => v < 2) && !['salvo', 'broadside'].includes(s.shown.kind)) a = 'repair';
  if (s.stance === 'aggressive' && post === 'gunner' && !['salvo', 'board'].includes(s.shown.kind)) a = 'broadside';
  if (s.stance === 'defensive' && post === 'pilot' && s.shown.kind !== 'board') a = 'evade';
  if (!odds(s, a)) a = ACTS[post][0].id;
  return a;
}
const choices = s => Object.fromEntries(Object.keys(POSTS).map(p => [p, p === UI.post ? s.mine : crewPick(s, p)]));
function startTurn(s) {
  if (!s.by || s.byUntil < s.turn) { const st = stancePick(s); if (st !== s.stance || s.turn === 0) log(s, 'captain', { aggressive: 'We take it to her. Guns first.', steady: 'Steady. Answer what she shows us.', defensive: 'Keep us whole. Answer, then shoot.' }[st]); s.stance = st; s.by = null; }
  s.real = herIntent(s); s.shown = s.real; s.feint = false;
  if (UI.veteran && !s.scanned && s.r() < 0.25) { const alt = s.real.kind === 'broadside' ? { kind: 'close' } : s.foe.guns ? { kind: 'broadside', room: 'bridge' } : null; if (alt && s.real.kind !== 'salvo') { s.shown = alt; s.feint = true; } }
  s.used = false; s.mine = crewPick(s, UI.post);
}

// ---------- what this turn is likely to do: shown before the turn is committed ----------
function forecast(s, ch) {
  const P = id => Object.values(ch).includes(id) ? odds(s, id) : 0, sh = 1 - (1 - K.SHIELD) * P('shields'), t = s.shown, f = s.foe;
  if (t.kind === 'salvo') { const per = (1 - 0.7 * P('pdc')) * (1 - 0.5 * P('jam')) * (1 - 0.25 * P('evade'));
    return { bare: `${t.n} torpedoes, about ${t.n * K.TORP} hull and damage below decks`, now: `each torpedo ${pct(per)}% to hit: about ${Math.round(t.n * per * K.TORP * sh)} hull expected` }; }
  if (t.kind === 'broadside') { const base = 0.6 + [0.15, 0.1, 0, -0.2][s.band], hit = clamp(base - 0.25 * P('evade') - 0.2 * P('suppress'), 0.05, 0.95);
    return { bare: `${pct(base)}% to hit: ${K.BROADSIDE} hull and the ${ROOM[t.room].name} damaged`, now: `${pct(hit)}% to hit, about ${Math.round(hit * K.BROADSIDE * sh)} hull expected` }; }
  if (t.kind === 'board') { const p = (f.lock ? 1 : 0) * (1 - P('open')) * (1 - P('spoof')) * (1 - P('aim-lock'));
    return { bare: 'the grapple takes: she boards you', now: `${pct(p)}% she gets the grapple on` }; }
  if (t.kind === 'close') return { bare: `the range closes to ${BANDS[Math.max(1, s.band - 1)]}`, now: `${pct(1 - P('open'))}% the range closes` };
  if (t.kind === 'arm') return { bare: 'a salvo of two next turn', now: `${pct(P('aim-launcher'))}% her launcher is out before it fires` };
  return { bare: 'she gets away', now: `${pct(P('close'))}% you keep her in range a turn longer` };
}

// ---------- the turn ----------
function commit() {
  const s = S; if (s.over) return;
  const ch = choices(s), ok = {}, lines = [], f = s.foe, now = performance.now();
  for (const [p, id] of Object.entries(ch)) { ok[id] = s.r() < odds(s, id); lines.push(`${p === UI.post ? 'You' : POSTS[p].crew}: ${ACT[id].label.toLowerCase()}, ${ok[id] ? 'done' : 'it does not come off'}.`); }
  const shields = ok.shields ? K.SHIELD : 1, bandMult = [1.5, 1.3, 1, 0.6][s.band];
  if (ok.repair) { const r = Object.entries(s.rooms).filter(([, v]) => v < 2).sort((a, b) => a[1] - b[1])[0]; if (r) { s.rooms[r[0]]++; lines.push(`Tomas's people patch the ${ROOM[r[0]].name}.`); } }
  if (ok.open) s.band = Math.min(3, s.band + 1); if (ok.close) s.band = Math.max(1, s.band - 1);
  const flankNow = s.flank; s.flank = !!ok.flank;
  if (ok.broadside) { const d = Math.round(K.GUN * bandMult * (ok.guns ? 1.3 : 1)); f.hull = Math.max(0, f.hull - d); lines.push(`The broadside hits her: ${d} off her hull.`); s.lastHurtBy = 'gunner'; s.fx.push({ k: 'hit', t0: now }); }
  for (const part of ['launcher', 'lock', 'guns']) if (ok['aim-' + part] && f[part] > 0) { f[part]--; lines.push(`Her ${part === 'lock' ? 'grapple' : part} ${f[part] ? 'is damaged' : 'is out'}.`); s.lastHurtBy = 'gunner'; }
  s.scanned = !!ok.scan; if (ok.scan) lines.push('Hester has her read: the crew are sharper next turn, and no feint gets past.');
  // her move: the real one
  const t = s.real;
  if (s.feint) lines.push(`<span class="warm">It was a feint: she did not ${THREAT[s.shown.kind]}.</span>`);
  if (t.kind === 'arm') { if (f.launcher) { f.armed = true; lines.push('She arms a salvo.'); } else lines.push('Her launcher is out. The salvo never comes.'); }
  if (t.kind === 'salvo') { f.armed = false; if (!f.launcher) lines.push('Her launcher is out. The salvo never comes.'); else { f.torps -= t.n;
    for (let i = 0; i < t.n; i++) { if (ok.pdc && s.r() < 0.7) { lines.push('The PDC kills a torpedo.'); continue; } if (ok.jam && s.r() < 0.5) { lines.push('A jammed torpedo runs wide.'); continue; } if (ok.evade && s.r() < 0.25) { lines.push('A torpedo misses as Ines throws her over.'); continue; }
      const room = ['engine', 'airlock', 'workshop'][Math.floor(s.r() * 3)], d = Math.round(K.TORP * shields); s.hull -= d; s.rooms[room] = Math.max(0, s.rooms[room] - 1); s.fx.push({ k: 'room', room, t0: now }); lines.push(`A torpedo hits: ${d} hull, the ${ROOM[room].name} ${s.rooms[room] ? 'damaged' : 'out'}.`); } } }
  if (t.kind === 'broadside' && f.guns) { const hit = s.r() < clamp(0.6 + [0.15, 0.1, 0, -0.2][s.band] - (ok.evade ? 0.25 : 0) - (ok.suppress ? 0.2 : 0), 0.05, 0.95);
    if (hit) { const d = Math.round(K.BROADSIDE * shields); s.hull -= d; s.rooms[t.room] = Math.max(0, s.rooms[t.room] - 1); s.fx.push({ k: 'room', room: t.room, t0: now }); lines.push(`Her broadside hits: ${d} hull, the ${ROOM[t.room].name} ${s.rooms[t.room] ? 'damaged' : 'out'}.`); } else lines.push('Her broadside misses.'); }
  if (t.kind === 'close') { if (ok.open) lines.push('She tries to close, and you open as fast.'); else { s.band = Math.max(1, s.band - 1); lines.push(`She closes to ${BANDS[s.band]} range.`); } }
  if (t.kind === 'board') { if (!f.lock) lines.push('Her grapple is out. She cannot board.'); else if (ok.open) lines.push('You open the range before the grapple holds.'); else if (ok.spoof) lines.push('The grapple locks on Hester\'s decoy and tears free.'); else s.over = { win: false, board: true, text: 'The grapple holds. She is alongside, and boarding.' }; }
  if (t.kind === 'break' && !ok.close) s.over = { win: true, text: 'She breaks off and runs, badly hurt.' };
  lines.forEach(l => log(s, 'ship', l, 'event'));
  if (!s.over) { if (f.hull <= 0) s.over = { win: true, text: 'Her hull is gone. She is dead in space.' }; else if (s.hull <= 0) s.over = { win: false, text: 'Our hull is gone.' }; else if (s.turn + 1 >= K.TURNS) s.over = { win: f.hull / f.max < s.hull / 100, text: f.hull / f.max < s.hull / 100 ? 'She breaks off, the worse hurt.' : 'Hester breaks off. We were the worse hurt.' }; }
  if (s.over) { log(s, 'ship', s.over.text, 'event'); return render(); }
  s.turn++; startTurn(s); render();
}
function suggest(stance) {
  const s = S; if (s.used || s.over) return; s.used = true;
  log(s, 'you', { aggressive: 'Captain, she is weaker than she looks. Take it to her.', steady: 'Captain, answer what she shows us.', defensive: 'Captain, keep us whole.' }[stance]);
  const ev = { aggressive: s.foe.hull / s.foe.max < s.hull / 100 ? 0.2 : -0.2, defensive: s.hull < 60 ? 0.2 : -0.15, steady: 0.1 }[stance], nf = { aggressive: (UI.nerve - 0.5) * 0.4, defensive: (0.5 - UI.nerve) * 0.4, steady: 0 }[stance];
  if (s.r() < clamp(0.2 + 0.35 * UI.trust + 0.07 * UI.level + ev + nf, 0.05, 0.95)) { s.stance = stance; s.by = 'you'; s.byUntil = s.turn + 1; log(s, 'captain', 'Good call. We do that.'); } else log(s, 'captain', 'Negative. We keep on.');
  s.mine = s.mine || crewPick(s, UI.post); render();
}
const takeOdds = st => { const s = S, ev = { aggressive: s.foe.hull / s.foe.max < s.hull / 100 ? 0.2 : -0.2, defensive: s.hull < 60 ? 0.2 : -0.15, steady: 0.1 }[st], nf = { aggressive: (UI.nerve - 0.5) * 0.4, defensive: (0.5 - UI.nerve) * 0.4, steady: 0 }[st]; return clamp(0.2 + 0.35 * UI.trust + 0.07 * UI.level + ev + nf, 0.05, 0.95); };

// ---------- the picture: the radar on the left, the ship in section on the right ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function arrow(x1, y1, x2, y2, c, dash) { ctx.strokeStyle = c; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]); const a = Math.atan2(y2 - y1, x2 - x1); ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - 8 * Math.cos(a - 0.4), y2 - 8 * Math.sin(a - 0.4)); ctx.moveTo(x2, y2); ctx.lineTo(x2 - 8 * Math.cos(a + 0.4), y2 - 8 * Math.sin(a + 0.4)); ctx.stroke(); }
function draw() {
  const W = cv.clientWidth, H = Math.round(W / 1.6), dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const s = S, now = performance.now(), ch = s.over ? {} : choices(s), has = id => Object.values(ch).includes(id), mine = id => ch[UI.post] === id;
  ctx.fillStyle = '#050a11'; ctx.fillRect(0, 0, W, H); ctx.font = '11px "IBM Plex Mono", monospace';
  // radar
  const cx = H / 2, cy = H / 2 + 8, R = H / 2 - 30, rOf = km => R * Math.sqrt(km / 45), bear = -50 * Math.PI / 180;
  BAND_KM.forEach((km, i) => { ctx.strokeStyle = i === s.band ? '#2f5680' : '#16273d'; ctx.beginPath(); ctx.arc(cx, cy, rOf(km + (i ? 4 : 1)), 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = '#3e5674'; ctx.fillText(BANDS[i].toUpperCase(), cx + 4, cy - rOf(km + (i ? 4 : 1)) + 12); });
  const hx = cx + Math.cos(bear) * rOf(BAND_KM[s.band]), hy = cy + Math.sin(bear) * rOf(BAND_KM[s.band]);
  ctx.fillStyle = '#7fb4ff'; ctx.fillText(`RANGE ${BANDS[s.band].toUpperCase()}  ${BAND_KM[s.band]} km   T${s.turn + 1}`, 10, 16);
  if (!s.over) {
    const t = s.shown, red = 'rgba(255,106,74,0.9)'; ctx.lineWidth = 1.5;
    if (t.kind === 'broadside') { arrow(hx, hy, cx + 10, cy - 8, red, [5, 4]); ctx.fillStyle = '#ff6a4a'; ctx.fillText(`BROADSIDE AT YOUR ${ROOM[t.room].name.toUpperCase()}`, hx - 120, hy - 14); }
    if (t.kind === 'salvo') for (const sg of [-1, 1]) { ctx.strokeStyle = red; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(hx, hy); ctx.quadraticCurveTo((hx + cx) / 2 + sg * 60, (hy + cy) / 2 + sg * 30, cx, cy); ctx.stroke(); ctx.setLineDash([]); }
    if (t.kind === 'salvo') { ctx.fillStyle = '#ff6a4a'; ctx.fillText(`${t.n} TORPEDOES, IMPACT THIS TURN`, hx - 140, hy - 14); }
    if (t.kind === 'arm') { ctx.strokeStyle = red; ctx.beginPath(); ctx.arc(hx, hy, 14 + 3 * Math.sin(now / 200), 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = '#ff6a4a'; ctx.fillText('ARMING A SALVO: IT COMES NEXT TURN', hx - 160, hy - 20); }
    if (t.kind === 'close') { const k = rOf(BAND_KM[Math.max(1, s.band - 1)]); arrow(hx, hy, cx + Math.cos(bear) * k, cy + Math.sin(bear) * k, red, [5, 4]); ctx.fillStyle = '#ff6a4a'; ctx.fillText('CLOSING', hx + 10, hy + 4); }
    if (t.kind === 'board') { ctx.strokeStyle = red; ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(cx, cy); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#ff6a4a'; ctx.fillText('GRAPPLE AT YOUR LOCK', hx + 10, hy - 8); }
    if (t.kind === 'break') { arrow(hx, hy, hx + Math.cos(bear) * 50, hy + Math.sin(bear) * 50, red, [5, 4]); ctx.fillStyle = '#ff6a4a'; ctx.fillText('BREAKING OFF', hx + 12, hy + 14); }
    if (UI.veteran && !s.scanned) { ctx.fillStyle = '#ffd27f'; ctx.fillText('MAY FEINT', hx + 12, hy + 28); }
    const col = id => mine(id) ? '#ffd27f' : 'rgba(127,180,255,0.85)';
    if (has('pdc')) { ctx.fillStyle = mine('pdc') ? 'rgba(255,210,127,0.18)' : 'rgba(74,163,255,0.18)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, rOf(9), bear - 0.9, bear + 0.9); ctx.closePath(); ctx.fill(); }
    if (has('shields')) { ctx.strokeStyle = col('shields'); ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.stroke(); }
    if (has('jam')) for (let k = 0; k < 3; k++) { ctx.strokeStyle = col('jam'); ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(cx, cy, 24 + k * 8 + (now / 60) % 8, bear - 0.5, bear + 0.5); ctx.stroke(); ctx.globalAlpha = 1; }
    if (has('spoof')) { ctx.strokeStyle = col('spoof'); ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.arc(cx - 30, cy + 24, 6, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = col('spoof'); ctx.fillText('DECOY', cx - 70, cy + 44); }
    if (has('evade')) { ctx.strokeStyle = col('evade'); ctx.beginPath(); ctx.arc(cx, cy, 30, Math.PI * 0.6, Math.PI * 1.1); ctx.stroke(); ctx.fillStyle = col('evade'); ctx.fillText('EVADE', cx - 70, cy - 10); }
    if (has('open') || has('close')) { const out = has('open'); arrow(cx, cy, cx - Math.cos(bear) * (out ? 36 : -36), cy - Math.sin(bear) * (out ? 36 : -36), col(out ? 'open' : 'close')); }
    const shot = ['broadside', 'aim-launcher', 'aim-lock', 'aim-guns', 'suppress'].find(has);
    if (shot) { ctx.strokeStyle = col(shot); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(hx, hy); ctx.stroke(); ctx.fillStyle = col(shot); ctx.fillText(`${ACT[shot].label.toUpperCase()}  ${pct(odds(s, shot))}%`, (cx + hx) / 2 + 10, (cy + hy) / 2 + 16); }
    ctx.lineWidth = 1;
  }
  ctx.fillStyle = '#ff6a4a'; ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = '#cfe3ff'; ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(6, 6); ctx.lineTo(0, 3); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill(); ctx.restore();
  // the ship in section
  const x0 = H + 30, x1 = W - 20, top = 26, dh = (H - 46) / 7.3, X = f => x0 + f * (x1 - x0), Y = d => top + d * dh + (d > 5 ? dh * 0.3 : 0);
  ctx.fillStyle = '#7fb4ff'; ctx.fillText('THE ICE HAULER', x0, 16);
  for (const r of ROOMS) { const y = Y(r.deck), hp = r.sys ? s.rooms[r.id] : 2, flash = s.fx.find(f => f.k === 'room' && f.room === r.id && now - f.t0 < 900);
    ctx.fillStyle = flash ? '#5a1d14' : hp === 0 ? '#3a1410' : hp === 1 ? '#33280f' : '#0c1624'; ctx.fillRect(X(r.x0), y, X(r.x1) - X(r.x0), dh - 5);
    ctx.strokeStyle = '#23405f'; ctx.strokeRect(X(r.x0) + 0.5, y + 0.5, X(r.x1) - X(r.x0) - 1, dh - 6);
    ctx.fillStyle = r.sys ? '#a8bdd6' : '#4f6780'; ctx.fillText(r.name.toUpperCase(), X(r.x0) + 6, y + 14);
    if (r.sys) { ctx.fillStyle = hp === 0 ? '#ff6a4a' : hp === 1 ? '#ffd27f' : '#5d7896'; ctx.fillText(`${r.sys}${hp === 2 ? '' : hp === 1 ? ': damaged' : ': out'}`, X(r.x0) + 6, y + 28); }
    if (!s.over && s.shown.kind === 'broadside' && s.shown.room === r.id) { ctx.strokeStyle = '#ff6a4a'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]); ctx.strokeRect(X(r.x0) + 2, y + 2, X(r.x1) - X(r.x0) - 4, dh - 9); ctx.setLineDash([]); ctx.lineWidth = 1; ctx.fillStyle = '#ff6a4a'; ctx.fillText('TARGET', X(r.x1) - 56, y + 14); }
    if (!s.over && s.shown.kind === 'salvo' && ['engine', 'airlock', 'workshop'].includes(r.id)) { ctx.strokeStyle = 'rgba(255,106,74,0.6)'; ctx.setLineDash([2, 3]); ctx.strokeRect(X(r.x0) + 2, y + 2, X(r.x1) - X(r.x0) - 4, dh - 9); ctx.setLineDash([]); }
    if (!s.over && s.shown.kind === 'board' && r.id === 'airlock') { ctx.strokeStyle = '#ff6a4a'; ctx.lineWidth = 2; ctx.strokeRect(X(r.x0) + 2, y + 2, X(r.x1) - X(r.x0) - 4, dh - 9); ctx.lineWidth = 1; ctx.fillStyle = '#ff6a4a'; ctx.fillText('GRAPPLE', X(r.x1) - 64, y + 14); } }
  ctx.fillStyle = '#101f33'; ctx.fillRect(X(0.48), top, X(0.52) - X(0.48), Y(6) + dh - 5 - top);
  // who is at which post
  const at = {}; for (const [p, d] of Object.entries(POSTS)) (at[d.room] = at[d.room] || []).push(p === UI.post ? 'You' : d.crew);
  ctx.textAlign = 'center'; for (const [room, names] of Object.entries(at)) { const r = ROOM[room], y = Y(r.deck) + dh - 16; names.forEach((n, i) => { const x = X(r.x1) - 18 - i * 22; ctx.fillStyle = n === 'You' ? '#ffd27f' : '#cfe3ff'; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#06101c'; ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.fillText(n === 'You' ? 'Y' : n[0], x, y + 3.5); ctx.font = '11px "IBM Plex Mono", monospace'; }); } ctx.textAlign = 'left';
  s.fx = s.fx.filter(f => now - f.t0 < 900);
  if (s.over) { ctx.fillStyle = 'rgba(5,10,17,0.8)'; ctx.fillRect(0, H / 2 - 26, W, 52); ctx.fillStyle = s.over.win ? '#7bd59d' : '#ff6a4a'; ctx.font = '600 15px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.fillText(s.over.text.toUpperCase(), W / 2, H / 2 + 5); ctx.textAlign = 'left'; }
  requestAnimationFrame(draw);
}

// ---------- the console ----------
const side = document.getElementById('side');
const seg = (act, opts, cur, cls = '') => `<div class="seg ${cls}">${opts.map(([v, l, dis]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${String(v) === String(cur)}" ${dis ? 'disabled' : ''}>${l}</button>`).join('')}</div>`;
function render() {
  const s = S, f = s.foe, P = UI.post, ch = s.over ? null : choices(s), fc = s.over ? null : forecast(s, ch);
  const strip = s.log.map(e => e.kind === 'event' ? `<div><time>${e.t}</time><span class="ev">${e.text}</span></div>` : `<div><time>${e.t}</time><span><b>${e.who === 'captain' ? 'Hester' : 'You'}</b>: ${e.text}</span></div>`).join('');
  const word = { aggressive: 'take it to her', steady: 'answer what she shows', defensive: 'keep us whole' };
  side.innerHTML = `
  <div class="card"><h1>Threat and answer spike</h1><p class="sub">Temporary. A corsair: one gun battery, a launcher with four torpedoes, a grapple. Each turn she shows what she will do. Each post answers with one action, at the odds shown. Hits land on the ship's rooms.</p>
    <div class="row"><span class="lab">Post</span>${seg('post', Object.keys(POSTS).map(p => [p, p[0].toUpperCase() + p.slice(1)]), P)}</div>
    <details id="setup" ${UI.setupOpen ? 'open' : ''}><summary>Setup: your level, trust, captain, her grade, seed</summary><div>
      <div class="row"><span class="lab">Your level</span>${seg('level', [0, 1, 2, 3, 4, 5].map(n => [n, String(n)]), UI.level)}<span class="note">the crew are 2</span></div>
      <div class="row"><span class="lab">Trust</span><input id="trust" type="range" min="0" max="1" step="0.05" value="${UI.trust}" aria-label="Hester's trust in you"><span class="read" id="trustv">${pct(UI.trust)}%</span></div>
      <div class="row"><span class="lab">Captain</span><input id="nerve" type="range" min="0" max="1" step="0.05" value="${UI.nerve}" aria-label="Hester's nerve"></div>
      <div class="row"><span class="lab">Her grade</span>${seg('vet', [[false, 'Green'], [true, 'Veteran: may feint']], UI.veteran)}</div>
      <div class="row"><span class="lab">Seed</span><span class="read">${UI.seed}</span><button data-act="restart">Restart</button><button data-act="newseed">New seed</button></div>
    </div></details></div>
  ${s.over ? `<div class="card over"><p style="color:${s.over.win ? 'var(--ok)' : 'var(--hot)'}">${s.over.text}</p>${s.over.board ? '<p class="note">In the game this is where the boarding fight starts (prototypes/boarding-spike.html).</p>' : ''}<div class="row"><button data-act="restart">Play it again</button><button data-act="newseed">New seed</button></div></div>` : `
  <div class="card"><h2>Turn ${s.turn + 1} of ${K.TURNS}</h2>
    <p class="threat"><b>She:</b> ${THREAT[s.shown.kind]}${s.shown.kind === 'broadside' ? ` at your ${ROOM[s.shown.room].name}` : ''}.${UI.veteran && !s.scanned ? ' <span class="warm">She may be feinting.</span>' : ''}<br>Unanswered: ${fc.bare}.</p>
    <p class="read"><b>Hester:</b> ${word[s.stance]}.${s.by ? ' <span class="note">On your suggestion.</span>' : ''}</p>
    <p class="summary"><b>Answers:</b> ${Object.entries(ch).map(([p, id]) => `${p === P ? '<span class="warm">you</span>' : POSTS[p].crew} ${ACT[id].label.toLowerCase()} (${pct(odds(s, id))}%)`).join(', ')}.<br><b>Likely:</b> ${fc.now}.</p>
    <div class="row"><span class="lab">Your answer</span></div>
    ${seg('mine', ACTS[P].map(a => [a.id, `${a.label} ${odds(s, a.id) ? pct(odds(s, a.id)) + '%' : 'not possible'}${a.answers.includes(s.shown.kind) ? ' <span class="tag">answers it</span>' : ''}`, !odds(s, a.id)]), s.mine, 'col')}
    ${roomPen(s, P) ? `<p class="read bad">Your post's room is ${roomPen(s, P) > 0.2 ? 'out' : 'damaged'}: ${pct(roomPen(s, P))} off your odds until it is repaired.</p>` : ''}
    <button class="go" data-act="go">End turn</button><p class="note">Or press <kbd>Space</kbd>.</p></div>
  <div class="card"><h2>Suggest to Hester</h2><div class="acts">${['aggressive', 'steady', 'defensive'].filter(x => x !== s.stance).map(x => `<button data-act="suggest" data-v="${x}" ${s.used ? 'disabled' : ''}>${word[x][0].toUpperCase() + word[x].slice(1)} ${pct(takeOdds(x))}%</button>`).join('')}</div><p class="note">Once a turn. The stance moves the crew's answers and some odds.</p></div>`}
  <div class="card"><h2>The two ships</h2>
    <div class="crew"><div><span>Our hull</span><span class="${s.hull > 60 ? 'good' : s.hull > 30 ? 'warm' : 'bad'}">${Math.max(0, s.hull)}</span></div>
    <div><span>Her hull</span><span>${f.hull} of ${f.max}</span></div>
    <div><span>Her guns</span><span>${['out', 'damaged', 'whole'][f.guns]}</span></div>
    <div><span>Her launcher</span><span>${f.launcher ? `whole, ${f.torps} torpedoes${f.armed ? ', armed' : ''}` : 'out'}</span></div>
    <div><span>Her grapple</span><span>${f.lock ? 'whole' : 'out'}</span></div>
    <div><span>Range</span><span>${BANDS[s.band]}</span></div></div></div>
  <div class="card"><h2>Net</h2><div class="strip">${strip}</div></div>
  <div class="card"><h2>What to judge</h2><ul class="q"><li>Is reading her move and picking the answer a fight, or a quiz with one right answer?</li><li>At pilot, engineer or comms, is one action a turn enough to care about?</li><li>Next to the radar prototype: is this simpler to read, and what did it lose?</li></ul></div>`;
}
side.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const v = b.dataset.v, act = b.dataset.act;
  if (act === 'go') return commit();
  if (act === 'restart') { S = newGame(UI.seed); return render(); }
  if (act === 'newseed') { UI.seed = 1 + Math.floor(Math.random() * 9999); S = newGame(UI.seed); return render(); }
  if (act === 'suggest') return suggest(v);
  if (act === 'post') { UI.post = v; S.mine = crewPick(S, v); }
  if (act === 'level') UI.level = +v;
  if (act === 'vet') UI.veteran = v === 'true';
  if (act === 'mine') S.mine = v;
  render();
});
side.addEventListener('input', e => { if (e.target.id === 'trust') { UI.trust = +e.target.value; document.getElementById('trustv').textContent = `${pct(UI.trust)}%`; } if (e.target.id === 'nerve') UI.nerve = +e.target.value; });
side.addEventListener('change', e => { if (['trust', 'nerve'].includes(e.target.id)) render(); });
side.addEventListener('toggle', e => { if (e.target.id === 'setup') UI.setupOpen = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.code === 'Space' && !['BUTTON', 'INPUT', 'SUMMARY'].includes(e.target.tagName)) { e.preventDefault(); commit(); } });
S = newGame(UI.seed); render(); requestAnimationFrame(draw);
</script>
</body>
</html>
