<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Fight Spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Temporary prototype (prototypes/README.md). Layout: a top bar of settings; the stage (what is happening, the radar, what has happened);
   the hand's post down the right. One dark look, by choice: it is a sensor board. */
:root {
  --bg: #060a10; --panel: #0b121c; --raised: #111b29; --line: #1d2d41;
  --fg: #d4e2f0; --dim: #7a8ea6; --accent: #7fb4ff; --hot: #ff6a4a; --warm: #ffd27f; --ok: #7bd59d;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; --sans: 'IBM Plex Sans', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); gap: 10px 16px; max-width: 1500px; margin: 0 auto; padding: 10px 16px; box-sizing: border-box; min-height: 100%; }
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; position: relative; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.top .grp { display: flex; gap: 6px; align-items: center; }
.top .seg button { padding: 3px 8px 3px 20px; font-size: 11px; }
.top .seg button::before { left: 6px; width: 7px; height: 7px; margin-top: -4px; }
.play { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.stage { display: grid; gap: 8px; align-content: start; min-width: 0; }
canvas { display: block; width: 100%; max-width: min(100%, calc(100vh - 370px)); aspect-ratio: 1; margin: 0 auto; border: 1px solid var(--line); border-radius: 4px; background: #050a11; cursor: crosshair; }
.sit { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1.2fr 1.1fr; gap: 6px; }
.sit .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; font: 12px/1.45 var(--mono); min-width: 0; }
.sit .cell.alert { border-color: var(--hot); } .sit .cell.paused { border-color: var(--warm); }
.sit .k { display: block; color: var(--dim); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
.sit .v { color: var(--fg); }
.gauge { display: grid; grid-template-columns: 30px minmax(0, 1fr) 26px; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--raised); border-radius: 2px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); } .bar.foe i { background: var(--hot); }
.tl { display: grid; gap: 6px; }
.track { position: relative; height: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
.track i { position: absolute; top: 3px; width: 4px; height: 12px; margin-left: -2px; border-radius: 1px; cursor: pointer; }
.track b { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--fg); opacity: 0.5; }
.evs { display: grid; gap: 2px; font: 12px/1.45 var(--mono); }
.evs div { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; cursor: default; padding: 0 4px; border-radius: 2px; }
.evs div:hover { background: var(--raised); }
.evs time, .track + .evs .t { color: var(--dim); }
.legend { font: 11px/1.5 var(--mono); color: var(--dim); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.legend b { font-weight: 500; }
.side { display: grid; gap: 10px; align-content: start; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.card h2 { margin: 0; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.card h2 em { font-style: normal; color: var(--accent); }
h1 { margin: 0; font: 600 13px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.lab { font: 11px var(--mono); color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; min-width: 56px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
button { font: 500 12px var(--mono); background: var(--raised); border: 1px solid var(--line); color: var(--fg); padding: 5px 10px; border-radius: 3px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #06101c; }
.seg button { position: relative; padding-left: 24px; background: transparent; color: var(--dim); }
.seg button::before { content: ""; position: absolute; left: 8px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border: 1px solid var(--dim); border-radius: 50%; }
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--raised); border-color: var(--accent); }
.seg button[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.go { font-size: 13px; padding: 6px 18px; background: #16304f; border-color: var(--accent); letter-spacing: 0.06em; }
.summary { margin: 0; padding: 7px 10px; background: var(--raised); border-left: 2px solid var(--accent); font: 13px/1.5 var(--mono); }
details > summary { cursor: pointer; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.setup { position: relative; }
.setup-panel { position: absolute; top: calc(100% + 8px); left: 0; z-index: 10; width: 440px; background: var(--panel); border: 1px solid var(--accent); border-radius: 4px; padding: 12px; display: grid; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
.how > div { display: grid; gap: 6px; margin-top: 6px; }
.note { font-size: 13px; color: var(--dim); margin: 0; }
.read { font: 13px/1.5 var(--mono); margin: 0; }
.bad { color: var(--hot); } .good { color: var(--ok); } .warm { color: var(--warm); }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; } .pips span { width: 10px; height: 7px; background: var(--raised); border-radius: 1px; } .pips span.on { background: var(--warm); } .pips span.over { background: var(--hot); }
.incoming { border-color: var(--warm); }
.msg { display: grid; gap: 6px; } .msg p { margin: 0; }
.strip { display: grid; gap: 4px; max-height: 260px; overflow-y: auto; font: 12px/1.45 var(--mono); margin-top: 6px; }
.strip div { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; }
.strip time { color: var(--dim); } .strip .who { font-weight: 600; } .strip .reply { opacity: 0.85; padding-left: 12px; } .strip .ev { color: var(--dim); }
.crew { display: grid; gap: 4px; font: 12px/1.45 var(--mono); }
.crew div { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; }
.p-gunner { color: #ff9a6a; } .p-pilot { color: var(--accent); } .p-engineer { color: var(--warm); } .p-comms { color: var(--ok); } .p-ship { color: var(--dim); } .p-captain { color: #eef3f9; font-weight: 600; }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 100px; }
.over { border-color: var(--accent); } .over p { margin: 0; font: 500 14px var(--mono); }
ul.q { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; display: grid; gap: 4px; }
.need { display: grid; gap: 6px; }
.need .it { display: grid; gap: 6px; padding: 7px 9px; border-left: 3px solid var(--dim); background: var(--raised); border-radius: 2px; font: 13px/1.4 var(--mono); }
.need .it.bad { border-left-color: var(--hot); } .need .it.warm { border-left-color: var(--warm); } .need .it.info { border-left-color: var(--accent); }
.need .it .fx { display: flex; flex-wrap: wrap; gap: 6px; }
.need .it .fx button { background: #16304f; border-color: var(--accent); }
.need .quiet { font: 13px var(--mono); color: var(--dim); }
.card.needs { border-color: var(--hot); } .card.calm { border-color: var(--line); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
.tiles button { padding: 10px 6px; font: 600 12px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; text-align: center; background: var(--raised); color: var(--dim); }
.tiles button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #06101c; }
.tiles button::before { display: none; }
.grp-l { font: 10px var(--mono); color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: -2px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.meters .m { background: var(--raised); border-radius: 3px; padding: 6px 9px; min-width: 0; }
.meters .m span { display: block; font: 10px var(--mono); color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; }
.meters .m b { font: 600 18px var(--mono); font-variant-numeric: tabular-nums; }
.meters .m b.bad { color: var(--hot); } .meters .m b.good { color: var(--ok); } .meters .m b.warm { color: var(--warm); }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; color: var(--dim); }
</style>
</head>
<body>

<div class="app">
  <header class="top" id="top"></header>
  <main class="stage">
    <div class="sit" id="sit"></div>
    <canvas id="cv" aria-label="Radar: your ship at the center, the contact, torpedoes, predicted tracks and where things happened"></canvas>
    <div class="tl" id="tl"></div>
    <div class="legend">
      <span><b style="color:#cfe3ff">ship</b> you, nose line, course arrow</span><span><b style="color:#ff6a4a">contact</b> her, track and error bands</span>
      <span><b style="color:#ff6a4a">dashed ring</b> where she can be at cycle end</span><span><b style="color:#ffd27f">ring</b> where your slug can land</span>
      <span><b style="color:#4aa3ff">wedge</b> PDC arc</span><span><b style="color:#7fb4ff">CPA</b> closest approach</span><span>marks fade over 3 cycles; hover the timeline to find one</span>
    </div>
  </main>
  <aside class="side" id="side"></aside>
</div>

<script>
'use strict';
// Throwaway spike: is the fight better played on the radar (A) or ordered at a post with the geometry drawn (B), and do calls between posts make a crew?
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const K = { REACH: 50, TURN_S: 20, SUB: 24, ME_ACC: 3, FOE_ACC: 3.2, BEAR: 30 * DEG, PDC_R: 9, TORP_ACC: 6.5, TORP_MAX: 15, TORP_HIT: 1.0, TORP_DMG: 22, TORP_LIFE: 4,
  GUN_DMG: [0, 12, 18, 24, 28], GUN_HEAT: [0, 1, 2, 3, 4], DRIVE: [0.45, 0.75, 1, 1.2, 1.35], PDC_RATE: [0, 0.55, 1, 1.4, 1.7], CREW_LVL: 2, TURN: 90 * DEG, GATE: 30 * DEG, HEAT_CAP: 5, FOE_GUN: 8, TURNS: 16, ESCAPE: 60, DETECT: 12, KEEP: 20, FOE_KEEP: 15, VENT_EVERY: 5, HIT: 0.7 };
// The opening: long (she is met at 250 km, torpedoes are fast and long-legged) or short (the 40 km fight, as before).
const OPENING = { long: { TORP_ACC: 10, TORP_MAX: 40, TORP_LIFE: 10, TURNS: 50, ESCAPE: 400, FOE_CLOSE: 12 }, short: { TORP_ACC: 6.5, TORP_MAX: 15, TORP_LIFE: 4, TURNS: 16, ESCAPE: 60, FOE_CLOSE: 4 } };
const falloff = r => r > 30 ? 0.5 : r > 20 ? 0.75 : 1;   // a slug's damage at long range
const POSTS = ['gunner', 'pilot', 'engineer', 'comms'];
const NAME = { gunner: 'Gunner', pilot: 'Pilot', engineer: 'Engineer', comms: 'Comms', all: 'All posts', ship: 'Ship', captain: 'Captain' };
const PRESETS = { balanced: { drive: 2, guns: 2, pdc: 2 }, drive: { drive: 3, guns: 1, pdc: 2 }, guns: { drive: 1, guns: 3, pdc: 2 }, pdc: { drive: 1, guns: 2, pdc: 3 } };

const V = (x, y) => ({ x, y });
const add = (a, b) => V(a.x + b.x, a.y + b.y), sub = (a, b) => V(a.x - b.x, a.y - b.y), mul = (a, k) => V(a.x * k, a.y * k);
const len = a => Math.hypot(a.x, a.y), norm = a => { const l = len(a) || 1; return V(a.x / l, a.y / l); };
const ang = a => Math.atan2(a.y, a.x), dirv = (t, l = 1) => V(Math.cos(t) * l, Math.sin(t) * l);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const adiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return Math.abs(d); };
const brg = v => Math.round((Math.atan2(v.x, -v.y) / DEG + 360) % 360) % 360;
const pad3 = n => String(n).padStart(3, '0');
const clock = turn => { const s = turn * K.TURN_S; return `T+${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function move(b, a, dt) { b.p = V(b.p.x + b.v.x * dt + 0.5 * a.x * dt * dt, b.p.y + b.v.y * dt + 0.5 * a.y * dt * dt); b.v = V(b.v.x + a.x * dt, b.v.y + a.y * dt); }
function segDist(a, b) { const d = sub(b, a), l2 = d.x * d.x + d.y * d.y; const t = l2 ? clamp(-(a.x * d.x + a.y * d.y) / l2, 0, 1) : 0; return len(add(a, mul(d, t))); }

const UI = { hl: null, logOpen: false, opening: 'long', zoom: 'auto', time: 'real', speed: 16, setupOpen: false, mode: 'A', post: 'gunner', trust: 0.5, tool: 'aim', seed: 7, accurate: false, hardened: false, sensors: 100, nerve: 0.5, level: 2 };  // nerve: the captain's; level: yours at your post  // the fire-control suite's two upgrades, and the sensors' condition
let S;

function newGame(seed) {
  Object.assign(K, OPENING[UI.opening]);
  const r = mulberry(seed);
  const s = { seed, r, r2: mulberry(seed * 31 + 5), turn: 0, phase: 'plan', comms: 'watch', nextId: 1,
    me: { p: V(0, 0), v: V(0, -1), hull: 100, heat: 0, locked: false, nose: -Math.PI / 2, lastVent: -99 },
    foe: { p: UI.opening === 'long' ? V(160.7, -191.5) : V(24, -30), v: UI.opening === 'long' ? V(-6.4, 7.7) : V(-2.4, 3.4), hull: 60, max: 60, torps: 4, armed: false, bias: r() < 0.5 ? -1 : 1 },
    events: [], torps: [], tracers: [], fx: [], slug: null, paused: false, pauseWhy: '', nearSaid: new Set(), lastIntent: 'hold', hull0: 100, log: [], asks: {}, warned: new Set(), incoming: [], used: {}, noBear: false, over: null, turnLines: [],
    ui: { role: 'attack', face: 'her', thrust: { dir: -Math.PI / 2, thr: 0 }, aim: null, fire: true, pdcDir: 0, pdcW: 90, power: { drive: 2, guns: 2, pdc: 2 }, vent: false, comms: 'watch',
      b: { role: 'attack', pilot: 'order', fire: true, pdc: 'forward', eng: 'book', comms: 'watch' } }, order: null, lastPower: { drive: 2, guns: 2, pdc: 2 }, ov: {} };
  s.ui.pdcDir = ang(sub(s.foe.p, s.me.p));
  s.errU = { p: unitDisk(s.r2), v: unitDisk(s.r2) };
  return s;
}

// ---------- what the ship knows ----------
const range = s => len(sub(s.foe.p, s.me.p));
const losMe = s => norm(sub(s.foe.p, s.me.p));
const near = (s, t) => len(sub(t.p, s.me.p)) < K.DETECT;
const inbound = s => s.torps.filter(t => s.comms === 'watch' || near(s, t));       // what the board shows: comms watching, or close
const known = s => s.torps.filter(t => near(s, t) || s.warned.has(t.id));          // what the crew acts on: their own close read, or a call-out
function eta(s, t) { const rel = sub(t.p, s.me.p), rv = sub(t.v, s.me.v); const c = -(rel.x * rv.x + rel.y * rv.y) / (len(rel) || 1); return c > 0.5 ? len(rel) / c : 99; }
const nearestOf = (s, list) => list.reduce((b, t) => (!b || len(sub(t.p, s.me.p)) < len(sub(b.p, s.me.p)) ? t : b), null);
const threat = s => inbound(s).some(t => eta(s, t) < 3);
const ventReady = s => s.turn - s.me.lastVent >= K.VENT_EVERY;
function ask(s, key, val, n) { s.asks[key] = { val, until: s.turn + n - 1 }; }
function asked(s, key) { const a = s.asks[key]; return a && a.until >= s.turn ? a.val : undefined; }
function biasVec(s) { const los = norm(sub(s.me.p, s.foe.p)); return mul(V(-los.y, los.x), s.foe.bias); }
function sideWord(s) { const l = losMe(s), b = biasVec(s); return l.x * b.y - l.y * b.x > 0 ? 'right' : 'left'; }
function torpWarn(s) { const t = nearestOf(s, inbound(s)); return t ? `Torps inbound, bearing ${pad3(brg(sub(t.p, s.me.p)))}, ${eta(s, t) < 20 ? `impact in about ${Math.max(1, Math.round(eta(s, t)))} turn${Math.round(eta(s, t)) > 1 ? 's' : ''}` : 'not closing on us yet'}.` : 'Torps inbound.'; }

// ---------- the board's error ----------
// Stock fire control sees everything, with error. Her contact is drawn off her true place by an error that is fixed for the turn, and it
// grows the further ahead the board projects (a velocity error). The bands drawn are honest: the truth is inside them.
const SENS = { BASE: 0.5, VEL: 0.5 };
const degr = () => 1 + (1 - UI.sensors / 100) * (UI.hardened ? 0.6 : 2.5);   // worn sensors widen the error; hardened ones much less
const sigmaOf = comms => SENS.BASE * (UI.accurate ? 0.5 : 1) * degr() * (comms === 'lock' ? 0.6 : 1);
const bandAt = (g, t) => g * (1 + SENS.VEL * t);
const unitDisk = rnd => dirv(rnd() * TAU, Math.sqrt(rnd()));
const pct = x => Math.round(x * 100);
function seenFoe(s, comms) { const g = sigmaOf(comms); return { ...s.foe, p: add(s.foe.p, mul(s.errU.p, g)), v: add(s.foe.v, mul(s.errU.v, g * SENS.VEL)) }; }

// ---------- her ----------
function foeAcc(s, rnd) {
  const me = s.me, f = s.foe, rel = sub(me.p, f.p), r = len(rel), los = norm(rel);
  let a = sub(add(me.v, mul(los, clamp((r - K.FOE_KEEP) * 0.3, -4, K.FOE_CLOSE))), f.v);
  if (r > 60) return len(a) > K.FOE_ACC ? mul(norm(a), K.FOE_ACC) : a;   // far out she comes straight in: jinking is for when a gun can reach her
  if (len(a) > K.FOE_ACC * 0.6) a = mul(norm(a), K.FOE_ACC * 0.6);
  const side = rnd() < 0.75 ? f.bias : -f.bias;                    // she has a habit: three times in four she jinks to the same side
  a = add(a, mul(V(-los.y, los.x), side * K.FOE_ACC * (0.55 + 0.45 * rnd())));
  return len(a) > K.FOE_ACC ? mul(norm(a), K.FOE_ACC) : a;
}

// ---------- the crew's own read (for every post you do not hold) ----------
function aiPilot(s) { const a = asked(s, 'pilot'); return a && allows(s, a) ? a : orderOf(s).intent; }
function aiGunner(s, bears) {
  const af = asked(s, 'gunner.fire'), ap = asked(s, 'gunner.pdc');
  const fire = af !== undefined ? af : bears && range(s) < 60 && !(s.me.heat >= K.HEAT_CAP - 1 && s.foe.hull > 20);
  const role = ap === 'threat' || known(s).some(t => eta(s, t) < 1.6) ? 'pd' : 'attack';   // the PDC when a torpedo will reach its range this cycle
  return { fire, pdc: ap || (known(s).length ? 'threat' : 'forward'), role };
}
const aiEngineer = s => asked(s, 'engineer') || ORDER[orderOf(s).intent].power;
function aiComms(s) { return asked(s, 'comms') || ORDER[orderOf(s).intent].comms; }

// ---------- the captain ----------
// The captain sets the intent each turn, by the state of the fight and their nerve. The gunner works the geometry inside it. Pilot, engineer
// and comms carry it out, with a skill check on how well, and suggest changes, which the captain weighs.
const ORDER = {
  engage: { text: 'Close to twelve and work her.', power: 'guns', comms: 'lock' },
  hold: { text: 'Hold at twenty. Trade with her.', power: 'balanced', comms: 'watch' },
  open: { text: 'Open the range.', power: 'drive', comms: 'watch' },
  break: { text: 'Break off. Open it all the way.', power: 'drive', comms: 'spoof' },
  evade: { text: 'Evade. Fish in the water.', power: 'pdc', comms: 'spoof' },
};
const lvl = post => post === UI.post ? UI.level : K.CREW_LVL;
const shares = s => [s.me.hull / 100, s.foe.hull / s.foe.max];
const nerveWord = () => UI.nerve < 0.35 ? 'cautious' : UI.nerve > 0.65 ? 'bold' : 'steady';
function captainPick(s) {
  const n = UI.nerve, [ours, hers] = shares(s);
  if (known(s).some(t => eta(s, t) < 2.5) && !(n > 0.75 && hers < 0.3)) return 'evade';
  if (ours < 0.4 && hers > ours && n < 0.6) return 'break';
  if (hers < ours - 0.2 || n > 0.65) return 'engage';
  if (range(s) < 9 && n < 0.4) return 'open';
  return 'hold';
}
const orderOf = s => s.order || { intent: 'hold' };
function allows(s, a) { const i = orderOf(s).intent; return a === 'nose' ? (i === 'engage' || i === 'hold') : a === 'coast' ? i !== 'evade' : true; }
function evidence(s, intent) { const [ours, hers] = shares(s), torps = known(s).some(t => eta(s, t) < 3);

    if (s.comms !== 'watch' && s.foe.torps > 0) add('info', `You are ${COMMS_WORD[s.comms]}: blind past 12 km, so a salvo will come without warning.`, fix('Watch her tubes', 'comms', 'watch'));
  }
  return items;
}
// ---------- the post's console: its choices as tiles, its state as meters ----------
function consolePanel(s, o) {
  const P = UI.post, A = UI.mode === 'A', ui = s.ui;
  const m = (label, val, cls = '') => `<div class="m"><span>${label}</span><b class="${cls}">${val}</b></div>`, g = label => `<div class="grp-l">${label}</div>`;
  if (P === 'gunner') return `${g('Fire control, this cycle')}${seg(A ? 'role' : 'brole', [['attack', 'The gun'], ['pd', 'The PDC']], A ? ui.role : ui.b.role, 'tiles')}
    ${g('Gun')}${seg(A ? 'afire' : 'bfire', [[true, 'Fire'], [false, 'Hold']], A ? ui.fire : ui.b.fire, 'tiles')}
    ${A ? `${g('Clicks on the radar')}${seg('tool', [['aim', 'Place the shot'], ['pdc', 'Point the PDC']], UI.tool, 'tiles')}<div class="row"><span class="lab">PDC arc</span><input id="pdcw" type="range" min="30" max="160" step="5" value="${ui.pdcW}" aria-label="PDC arc width"><span class="read" id="pdcwv">${ui.pdcW} deg</span></div>`
      : `${g('PDC looks')}${seg('bpdc', [['forward', 'Her bow'], ['threat', 'The threat'], ['wide', 'Wide']], ui.b.pdc, 'tiles')}`}
    <div class="meters">${m('Solution', o.aim && o.role === 'attack' ? `${pct(o.solLo)}-${pct(o.solHi)}%` : '--', o.canFire ? 'good' : '')}${m('Heat', `${s.me.heat} / ${K.HEAT_CAP}`, s.me.locked ? 'bad' : s.me.heat >= K.HEAT_CAP - 1 ? 'warm' : '')}
      ${m('Spread', `${o.R.toFixed(1)} km`)}${m('Damage', `${Math.round(K.GUN_DMG[o.power.guns] * falloff(range(s)))} a hit`)}</div>`;
  if (P === 'pilot') { const steady = !A && ui.b.pilot === 'steady', pr = project(s, o), c = pr.cpa;
    return `${A ? `${g('Burn')}<div class="tiles"><button data-act="asorder">As ordered</button><button data-act="coast">Coast</button></div>${g('Coasting, the nose')}${seg('face', [['her', 'Turns to her'], ['hold', 'Holds']], ui.face, 'tiles')}`
      : `${g('Burn')}${seg('bpilot', [['order', 'As ordered'], ['steady', 'Steady']], ui.b.pilot, 'tiles')}`}
    <div class="meters">${m('Burn', o.thrust.thr > 0.02 ? `${pct(o.thrust.thr)}% ${pad3(brg(dirv(o.thrust.dir)))}` : 'coast')}${m('Facing', `${pad3(brg(dirv(s.me.nose)))}${adiff(s.me.nose, o.nose) > 0.05 ? ` > ${pad3(brg(dirv(o.nose)))}` : ''}`)}
      ${m('Gun', o.bears ? 'bears' : `${offHer(s, o)} off`, o.bears ? 'good' : 'bad')}${m('Closest', c.i === 0 ? 'opening' : c.i === pr.last ? '4+ cyc' : `${c.d.toFixed(0)} km`)}
      ${m('Scatter', `+/- ${Math.round(scatterDeg(steady) * 2)} deg`)}${m('Course', `${pad3(brg(s.me.v))} at ${len(s.me.v).toFixed(1)}`)}</div>`; }
  if (P === 'engineer') return `${g('Carry out the order')}${seg('beng', [['book', `By the book ${pct(engOdds(false))}%`], ['push', `Push it ${pct(engOdds(true))}%`]], ui.b.eng, 'tiles')}
    ${g('The gun')}<div class="tiles"><button class="toggle" data-act="vent" aria-pressed="${ui.vent}" ${ventReady(s) ? '' : 'disabled'}>${ventReady(s) ? `Vent ${pct(ventOdds())}%` : `Vent in ${K.VENT_EVERY - (s.turn - s.me.lastVent)}`}</button></div>
    <div class="meters">${m('Drive', o.power.drive)}${m('Gun', o.power.guns)}${m('PDC', o.power.pdc)}${m('Heat', `${s.me.heat} / ${K.HEAT_CAP}`, s.me.locked ? 'bad' : s.me.heat >= K.HEAT_CAP - 1 ? 'warm' : '')}</div>`;
  const nt = nearestOf(s, inbound(s));
  return `${g('Mode')}${seg('comms', [['watch', 'Watch'], ['lock', `Lock ${pct(commsOdds('lock'))}%`], ['spoof', `Spoof ${pct(commsOdds('spoof'))}%`]], ui.comms, 'tiles')}
    <div class="meters">${m('Torpedoes', inbound(s).length || 'none', inbound(s).length ? 'bad' : '')}${m('First impact', nt ? `${eta(s, nt).toFixed(1)} cyc` : '--')}
      ${m('Board error', `${sigmaOf(o.comms).toFixed(2)} km`)}${m('Captain wants', ORDER[orderOf(s).intent].comms)}</div>`;
}
function render() {
  const s = S, o = s.phase === 'plan' ? buildOrders(s) : s.exec.o, P = UI.post, plan = (s.phase === 'plan' || (UI.time === 'real' && s.paused)) && !s.over;
  // the post's panel: its explanations fold into one "how this post works"
  const notes = []; const pp = postPanel(s, o).replace(/<p class="note">([\s\S]*?)<\/p>/g, (m, t) => { notes.push(t); return ''; });
  const playBtn = UI.time === 'real' ? `<button class="go" data-act="pause" ${s.over ? 'disabled' : ''}>${s.paused || s.phase === 'plan' ? 'Play' : 'Pause'}</button>` : `<button class="go" data-act="go" ${plan ? '' : 'disabled'}>${s.phase === 'exec' ? 'Playing' : 'End turn'}</button>`;
  topEl.innerHTML = `<h1>Radar fight spike</h1>
    <div class="grp"><span class="lab">Post</span>${seg('post', POSTS.map(p => [p, NAME[p]]), P)}</div>
    <div class="grp"><span class="lab">Mode</span>${seg('mode', [['A', 'A: plot'], ['B', 'B: order']], UI.mode)}</div>
    <div class="grp"><span class="lab">Time</span>${seg('time', [['turns', 'Turns'], ['real', 'Real time']], UI.time)}${UI.time === 'real' ? seg('speed', [[1, '1x'], [2, '2x'], [16, '16x']], UI.speed) : ''}</div>
    <div class="grp"><span class="lab">Zoom</span>${seg('zoom', [['auto', 'Auto'], ['50', '50'], ['150', '150'], ['400', '400 km']], UI.zoom)}</div>
    <details id="setup" class="setup" ${UI.setupOpen ? 'open' : ''}><summary>Setup</summary><div class="setup-panel">
      <p class="note">Throwaway. The hauler against a corsair with four torpedoes. The same seed plays the same fight, so you can compare modes and posts.</p>
      <div class="row"><span class="lab">Trust</span><input id="trust" type="range" min="0" max="1" step="0.05" value="${UI.trust}" aria-label="How much the crew trusts you"><span class="read" id="trustv">${Math.round(UI.trust * 100)}%</span></div>
      <div class="row"><span class="lab">Captain</span><input id="nerve" type="range" min="0" max="1" step="0.05" value="${UI.nerve}" aria-label="The captain's nerve"><span class="read" id="nervev">${nerveWord()}</span></div>
      <div class="row"><span class="lab">Your level</span>${seg('level', [0, 1, 2, 3, 4, 5].map(n => [n, String(n)]), UI.level)}<span class="note">the crew are 2</span></div>
      <div class="row"><span class="lab">Opening</span>${seg('opening', [['long', 'Long: 250 km'], ['short', 'Short: 40 km']], UI.opening)}</div>
      <div class="row"><span class="lab">Accuracy</span>${seg('acc', [[false, 'Stock'], [true, 'Upgraded']], UI.accurate)}</div>
      <div class="row"><span class="lab">Resilience</span>${seg('hard', [[false, 'Stock'], [true, 'Hardened']], UI.hardened)}</div>
      <div class="row"><span class="lab">Sensors</span><input id="sens" type="range" min="20" max="100" step="5" value="${UI.sensors}" aria-label="Sensor condition"><span class="read" id="sensv">${UI.sensors}%</span></div>
      <p class="note">Board error now ${sigmaOf(o.comms).toFixed(2)} km. Accuracy halves it and tightens the gun; hardened keeps worn sensors from widening it; a comms lock narrows it on her.</p>
      <div class="row"><span class="lab">Seed</span><span class="read">${UI.seed}</span><button data-act="restart">Restart</button><button data-act="newseed">New seed</button></div>
      <ul class="q"><li>A against B: is plotting on the radar more fun, or just more work?</li><li>At a post without the gun, is there still a fight to play?</li><li>Do the calls make a crew, or are they menu chores?</li></ul>
    </div></details>
    <div class="play">${playBtn}<kbd>Space</kbd></div>`;
  side.innerHTML = `
  ${s.over ? `<div class="card over"><p style="color:${s.over.win ? 'var(--ok)' : 'var(--hot)'}">${s.over.text}</p><div class="row"><button data-act="restart">Play it again</button><button data-act="flip">Again in ${UI.mode === 'A' ? 'B' : 'A'}</button></div></div>` : ''}
  ${(() => { const need = attention(s, o, plan); return `<div class="card ${need.length ? 'needs' : 'calm'}"><h2>Needs you</h2><div class="need">${need.length ? need.join('') : '<span class="quiet">Nothing. The crew have it.</span>'}</div></div>`; })()}
  <div class="card"><h2>Your post: <em>${NAME[P]}</em></h2>${consolePanel(s, o)}
    ${notes.length ? `<details class="how"><summary>How this post works</summary><div>${notes.map(n => `<p class="note">${n}</p>`).join('')}</div></details>` : ''}</div>
  <div class="card"><h2>Your calls</h2><div class="acts">${CALLS[P].map(c => `<button data-act="call" data-id="${c.id}" title="${P === 'gunner' ? 'The posts weigh it against the captain\'s order and how far they trust you.' : 'The odds: your trust, your level, what the board shows, and the captain\'s nerve.'}" ${!plan || s.used[c.id] || (c.avail && !c.avail(s)) ? 'disabled' : ''}>${c.label} <span class="p-${c.to === 'all' ? 'ship' : c.to}">to ${NAME[c.to]}</span>${c.to === 'captain' ? ` ${pct(takeOdds(s, P, c.intent))}%${gunTag(s, c.intent)}` : ''}</button>`).join('')}</div></div>
  <div class="card"><h2>The crew this cycle</h2><div class="crew">${crewPanel(s, o)}</div></div>`;
  refresh(true);
}
// The situation bar and the timeline also follow the fight while it runs, between full renders.
let lastRefresh = 0, lastEvN = -1;
function refresh(force) {
  const now = performance.now(), s = S; if (!force && now - lastRefresh < 250) return; lastRefresh = now;
  const o = s.phase === 'plan' ? buildOrders(s) : s.exec.o;
  sit.innerHTML = sitHTML(s, o);
  if (force || s.events.length !== lastEvN || s.phase === 'exec') { lastEvN = s.events.length; tl.innerHTML = tlHTML(s); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const s = S, ui = s.ui, v = b.dataset.v, act = b.dataset.act, bool = v === 'true';
  if (act === 'mode') { UI.mode = v; }
  else if (act === 'acc') UI.accurate = bool;
  else if (act === 'level') UI.level = +v;
  else if (act === 'asorder') ui.thrust = { ...buildOrders(s).ordered };
  else if (act === 'autoaim') { const sf = seenFoe(s, s.comms); ui.aim = autoAim(s, s.comms); ui.aimRel = sub(ui.aim, add(sf.p, sf.v)); }
  else if (act === 'hard') UI.hardened = bool;
  else if (act === 'post') { UI.post = v; s.incoming = []; }
  else if (act === 'pause') return playPause();
  else if (act === 'time') { UI.time = v; S.paused = false; S.pauseWhy = ''; }
  else if (act === 'speed') UI.speed = +v;
  else if (act === 'zoom') UI.zoom = v;
  else if (act === 'opening') { UI.opening = v; S = newGame(UI.seed); aiCalls(S); }
  else if (act === 'restart') { S = newGame(UI.seed); aiCalls(S); }
  else if (act === 'newseed') { UI.seed = 1 + Math.floor(Math.random() * 9999); S = newGame(UI.seed); aiCalls(S); }
  else if (act === 'flip') { UI.mode = UI.mode === 'A' ? 'B' : 'A'; S = newGame(UI.seed); aiCalls(S); }
  else if (act === 'go') return commit();
  else if (act === 'tool') UI.tool = v;
  else if (act === 'afire') ui.fire = bool;
  else if (act === 'role') ui.role = v;
  else if (act === 'brole') ui.b.role = v;
  else if (act === 'bfire') ui.b.fire = bool;
  else if (act === 'bpdc') ui.b.pdc = v;
  else if (act === 'bpilot') ui.b.pilot = v;
  else if (act === 'beng') ui.b.eng = v;
  else if (act === 'comms') { ui.comms = v; ui.b.comms = v; }
  else if (act === 'coast') { ui.thrust = { dir: s.me.nose, thr: 0 }; ui.face = 'hold'; }
  else if (act === 'face') ui.face = v;
  else if (act === 'nosefoe') { ui.thrust = { dir: ang(losMe(s)), thr: 0 }; ui.face = 'her'; }
  else if (act === 'vent') ui.vent = !ui.vent;
  else if (act === 'pw') { const k = b.dataset.k, d = +b.dataset.d, used = ui.power.drive + ui.power.guns + ui.power.pdc; const n = ui.power[k] + d; if (n >= 0 && n <= 3 && (d < 0 || used < 6)) ui.power[k] = n; }
  else if (act === 'call') return playerCall(b.dataset.id);
  else if (act === 'ans') return answer(+b.dataset.i, b.dataset.y === '1');
  render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'trust') { UI.trust = +e.target.value; document.getElementById('trustv').textContent = `${Math.round(UI.trust * 100)}%`; }
  if (e.target.id === 'nerve') { UI.nerve = +e.target.value; document.getElementById('nervev').textContent = nerveWord(); }
  if (e.target.id === 'sens') { UI.sensors = +e.target.value; document.getElementById('sensv').textContent = `${UI.sensors}%`; }
  if (e.target.id === 'pdcw') { S.ui.pdcW = +e.target.value; if (S.phase === 'exec') S.exec.o.pdcW = S.ui.pdcW; document.getElementById('pdcwv').textContent = `${S.ui.pdcW} deg`; }
});
document.addEventListener('toggle', e => { if (e.target.id === 'setup') UI.setupOpen = e.target.open; if (e.target.id === 'fulllog') UI.logOpen = e.target.open; }, true);
// hovering an event in the timeline rings where it happened on the radar
document.getElementById('tl').addEventListener('mouseover', e => { const el = e.target.closest('[data-i]'); UI.hl = el ? +el.dataset.i : null; });
document.getElementById('tl').addEventListener('mouseleave', () => { UI.hl = null; });
document.addEventListener('change', e => { if (e.target.id === 'pdcw' || e.target.id === 'sens') render(); if (e.target.id === 'nerve') { if (S.phase === 'plan' && !S.over && !(S.order && S.order.by)) S.order = { intent: captainPick(S), until: -1 }; render(); } });
document.addEventListener('keydown', e => { if (e.code === 'Space' && !['BUTTON', 'INPUT'].includes(e.target.tagName)) { e.preventDefault(); if (UI.time === 'real') playPause(); else commit(); } });

S = newGame(UI.seed); aiCalls(S); render(); requestAnimationFrame(draw);
