<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Fight Spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Temporary prototype (prototypes/README.md). Layout: the radar is the page, sticky on the left; the post's console runs down the right. One dark look, by choice: it is a sensor board. */
:root {
  --bg: #060a10; --panel: #0b121c; --raised: #111b29; --line: #1d2d41;
  --fg: #d4e2f0; --dim: #7a8ea6; --accent: #7fb4ff; --hot: #ff6a4a; --warm: #ffd27f; --ok: #7bd59d;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; --sans: 'IBM Plex Sans', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 410px); gap: 16px; max-width: 1440px; margin: 0 auto;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.radar { position: sticky; top: 16px; align-self: start; display: grid; gap: 10px; min-width: 0; }
canvas { display: block; width: 100%; max-width: min(100%, calc(100vh - 150px)); aspect-ratio: 1; margin: 0 auto; border: 1px solid var(--line); border-radius: 4px; background: #050a11; cursor: crosshair; }
.legend { font: 12px/1.5 var(--mono); color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; }
.legend b { font-weight: 500; }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.card h2 em { font-style: normal; color: var(--accent); }
h1 { margin: 0; font: 600 15px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.sub { margin: 0; color: var(--dim); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab { font: 11px var(--mono); color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; min-width: 64px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
button { font: 500 12px var(--mono); background: var(--raised); border: 1px solid var(--line); color: var(--fg); padding: 6px 10px; border-radius: 3px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #06101c; }
.seg button { position: relative; padding-left: 24px; background: transparent; color: var(--dim); }
.seg button::before { content: ""; position: absolute; left: 8px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border: 1px solid var(--dim); border-radius: 50%; }
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--raised); border-color: var(--accent); }
.seg button[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.summary { margin: 0; padding: 8px 10px; background: var(--raised); border-left: 2px solid var(--accent); font: 13px/1.5 var(--mono); }
details > summary { cursor: pointer; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
details[open] > summary { margin-bottom: 10px; }
details > div { display: grid; gap: 10px; }
button:disabled { opacity: 0.4; cursor: default; }
.go { font-size: 14px; padding: 10px; background: #16304f; border-color: var(--accent); width: 100%; letter-spacing: 0.06em; }
.note { font-size: 13px; color: var(--dim); margin: 0; }
.read { font: 13px/1.5 var(--mono); margin: 0; }
.read .bad { color: var(--hot); } .read .good { color: var(--ok); } .read .warm { color: var(--warm); }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--raised); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.foe i { background: var(--hot); }
.pips { display: flex; gap: 3px; } .pips span { width: 12px; height: 8px; background: var(--raised); border-radius: 1px; } .pips span.on { background: var(--warm); } .pips span.over { background: var(--hot); }
.eng { display: grid; grid-template-columns: 70px auto 1fr auto; gap: 6px 8px; align-items: center; font: 12px var(--mono); }
.incoming { border-color: var(--warm); }
.msg { display: grid; gap: 6px; }
.msg p { margin: 0; }
.strip { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; font: 12px/1.45 var(--mono); }
.strip div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
.strip time { color: var(--dim); }
.strip .who { font-weight: 600; }
.strip .reply { opacity: 0.85; padding-left: 12px; }
.strip .ev { color: var(--dim); }
.crew { display: grid; gap: 6px; font: 12px/1.45 var(--mono); }
.crew div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }
.p-gunner { color: #ff9a6a; } .p-pilot { color: var(--accent); } .p-engineer { color: var(--warm); } .p-comms { color: var(--ok); } .p-ship { color: var(--dim); } .p-captain { color: #eef3f9; font-weight: 600; }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 100px; }
.over { border-color: var(--accent); }
.over p { margin: 0; font: 500 14px var(--mono); }
ul.q { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; display: grid; gap: 4px; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; }
</style>
</head>
<body>

<div class="wrap">
  <section class="radar">
    <canvas id="cv" aria-label="Radar: your ship at the center, the contact, torpedoes and predicted tracks"></canvas>
    <div class="legend">
      <span><b style="color:#cfe3ff">ship</b> you, nose line</span>
      <span><b style="color:#ff6a4a">contact</b> corsair</span>
      <span><b style="color:#ff6a4a">dashed ring</b> where she can be at turn end</span>
      <span><b style="color:#ffd27f">ring</b> where your slug can land</span>
      <span><b style="color:#4aa3ff">wedge</b> PDC arc</span>
      <span><b style="color:#7fb4ff">CPA</b> closest approach</span><span>tracks run 4 turns, a dot and an error band each turn</span><span>1 turn = 20 s; rings at fifths of the radar's reach</span>
    </div>
  </section>
  <aside class="side" id="side"></aside>
</div>

<script>
'use strict';
// Throwaway spike: is the fight better played on the radar (A) or ordered at a post with the geometry drawn (B), and do calls between posts make a crew?
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const K = { REACH: 50, TURN_S: 20, SUB: 24, ME_ACC: 3, FOE_ACC: 3.2, BEAR: 30 * DEG, PDC_R: 9, TORP_ACC: 6.5, TORP_MAX: 15, TORP_HIT: 1.0, TORP_DMG: 22, TORP_LIFE: 4,
  GUN_DMG: [0, 12, 18, 24, 28], GUN_HEAT: [0, 1, 2, 3, 4], DRIVE: [0.45, 0.75, 1, 1.2, 1.35], PDC_RATE: [0, 0.55, 1, 1.4, 1.7], CREW_LVL: 2, TURN: 90 * DEG, GATE: 30 * DEG, HEAT_CAP: 5, FOE_GUN: 8, TURNS: 16, ESCAPE: 60, DETECT: 12, KEEP: 20, FOE_KEEP: 15, VENT_EVERY: 5, HIT: 0.7 };
// The opening: long (she is met at 250 km, torpedoes are fast and long-legged) or short (the 40 km fight, as before).
const OPENING = { long: { TORP_ACC: 10, TORP_MAX: 40, TORP_LIFE: 10, TURNS: 50, ESCAPE: 400, FOE_CLOSE: 12 }, short: { TORP_ACC: 6.5, TORP_MAX: 15, TORP_LIFE: 4, TURNS: 16, ESCAPE: 60, FOE_CLOSE: 4 } };
const falloff = r => r > 30 ? 0.5 : r > 20 ? 0.75 : 1;   // a slug's damage at long range
const POSTS = ['gunner', 'pilot', 'engineer', 'comms'];
const NAME = { gunner: 'Gunner', pilot: 'Pilot', engineer: 'Engineer', comms: 'Comms', all: 'All posts', ship: 'Ship', captain: 'Captain' };
const PRESETS = { balanced: { drive: 2, guns: 2, pdc: 2 }, drive: { drive: 3, guns: 1, pdc: 2 }, guns: { drive: 1, guns: 3, pdc: 2 }, pdc: { drive: 1, guns: 2, pdc: 3 } };

const V = (x, y) => ({ x, y });
const add = (a, b) => V(a.x + b.x, a.y + b.y), sub = (a, b) => V(a.x - b.x, a.y - b.y), mul = (a, k) => V(a.x * k, a.y * k);
const len = a => Math.hypot(a.x, a.y), norm = a => { const l = len(a) || 1; return V(a.x / l, a.y / l); };
const ang = a => Math.atan2(a.y, a.x), dirv = (t, l = 1) => V(Math.cos(t) * l, Math.sin(t) * l);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const adiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return Math.abs(d); };
const brg = v => Math.round((Math.atan2(v.x, -v.y) / DEG + 360) % 360) % 360;
const pad3 = n => String(n).padStart(3, '0');
const clock = turn => { const s = turn * K.TURN_S; return `T+${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function move(b, a, dt) { b.p = V(b.p.x + b.v.x * dt + 0.5 * a.x * dt * dt, b.p.y + b.v.y * dt + 0.5 * a.y * dt * dt); b.v = V(b.v.x + a.x * dt, b.v.y + a.y * dt); }
function segDist(a, b) { const d = sub(b, a), l2 = d.x * d.x + d.y * d.y; const t = l2 ? clamp(-(a.x * d.x + a.y * d.y) / l2, 0, 1) : 0; return len(add(a, mul(d, t))); }

const UI = { opening: 'long', zoom: 'auto', time: 'real', speed: 16, setupOpen: false, mode: 'A', post: 'gunner', trust: 0.5, tool: 'aim', seed: 7, accurate: false, hardened: false, sensors: 100, nerve: 0.5, level: 2 };  // nerve: the captain's; level: yours at your post  // the fire-control suite's two upgrades, and the sensors' condition
let S;

function newGame(seed) {
  Object.assign(K, OPENING[UI.opening]);
  const r = mulberry(seed);
  const s = { seed, r, r2: mulberry(seed * 31 + 5), turn: 0, phase: 'plan', comms: 'watch', nextId: 1,
    me: { p: V(0, 0), v: V(0, -1), hull: 100, heat: 0, locked: false, nose: -Math.PI / 2, lastVent: -99 },
    foe: { p: UI.opening === 'long' ? V(160.7, -191.5) : V(24, -30), v: UI.opening === 'long' ? V(-6.4, 7.7) : V(-2.4, 3.4), hull: 60, max: 60, torps: 4, armed: false, bias: r() < 0.5 ? -1 : 1 },
    torps: [], tracers: [], fx: [], slug: null, paused: false, pauseWhy: '', nearSaid: new Set(), lastIntent: 'hold', hull0: 100, log: [], asks: {}, warned: new Set(), incoming: [], used: {}, noBear: false, over: null, turnLines: [],
    ui: { role: 'attack', face: 'her', thrust: { dir: -Math.PI / 2, thr: 0 }, aim: null, fire: true, pdcDir: 0, pdcW: 90, power: { drive: 2, guns: 2, pdc: 2 }, vent: false, comms: 'watch',
      b: { role: 'attack', pilot: 'order', fire: true, pdc: 'forward', eng: 'book', comms: 'watch' } }, order: null, lastPower: { drive: 2, guns: 2, pdc: 2 }, ov: {} };
  s.ui.pdcDir = ang(sub(s.foe.p, s.me.p));
  s.errU = { p: unitDisk(s.r2), v: unitDisk(s.r2) };
  return s;
}

// ---------- what the ship knows ----------
const range = s => len(sub(s.foe.p, s.me.p));
const losMe = s => norm(sub(s.foe.p, s.me.p));
const near = (s, t) => len(sub(t.p, s.me.p)) < K.DETECT;
const inbound = s => s.torps.filter(t => s.comms === 'watch' || near(s, t));       // what the board shows: comms watching, or close
const known = s => s.torps.filter(t => near(s, t) || s.warned.has(t.id));          // what the crew acts on: their own close read, or a call-out
function eta(s, t) { const rel = sub(t.p, s.me.p), rv = sub(t.v, s.me.v); const c = -(rel.x * rv.x + rel.y * rv.y) / (len(rel) || 1); return c > 0.5 ? len(rel) / c : 99; }
const nearestOf = (s, list) => list.reduce((b, t) => (!b || len(sub(t.p, s.me.p)) < len(sub(b.p, s.me.p)) ? t : b), null);
const threat = s => inbound(s).some(t => eta(s, t) < 3);
const ventReady = s => s.turn - s.me.lastVent >= K.VENT_EVERY;
function ask(s, key, val, n) { s.asks[key] = { val, until: s.turn + n - 1 }; }
function asked(s, key) { const a = s.asks[key]; return a && a.until >= s.turn ? a.val : undefined; }
function biasVec(s) { const los = norm(sub(s.me.p, s.foe.p)); return mul(V(-los.y, los.x), s.foe.bias); }
function sideWord(s) { const l = losMe(s), b = biasVec(s); return l.x * b.y - l.y * b.x > 0 ? 'right' : 'left'; }
function torpWarn(s) { const t = nearestOf(s, inbound(s)); return t ? `Torps inbound, bearing ${pad3(brg(sub(t.p, s.me.p)))}, impact in about ${Math.max(1, Math.round(eta(s, t)))} turn${Math.round(eta(s, t)) > 1 ? 's' : ''}.` : 'Torps inbound.'; }

// ---------- the board's error ----------
// Stock fire control sees everything, with error. Her contact is drawn off her true place by an error that is fixed for the turn, and it
// grows the further ahead the board projects (a velocity error). The bands drawn are honest: the truth is inside them.
const SENS = { BASE: 0.5, VEL: 0.5 };
const degr = () => 1 + (1 - UI.sensors / 100) * (UI.hardened ? 0.6 : 2.5);   // worn sensors widen the error; hardened ones much less
const sigmaOf = comms => SENS.BASE * (UI.accurate ? 0.5 : 1) * degr() * (comms === 'lock' ? 0.6 : 1);
const bandAt = (g, t) => g * (1 + SENS.VEL * t);
const unitDisk = rnd => dirv(rnd() * TAU, Math.sqrt(rnd()));
const pct = x => Math.round(x * 100);
function seenFoe(s, comms) { const g = sigmaOf(comms); return { ...s.foe, p: add(s.foe.p, mul(s.errU.p, g)), v: add(s.foe.v, mul(s.errU.v, g * SENS.VEL)) }; }

// ---------- her ----------
function foeAcc(s, rnd) {
  const me = s.me, f = s.foe, rel = sub(me.p, f.p), r = len(rel), los = norm(rel);
  let a = sub(add(me.v, mul(los, clamp((r - K.FOE_KEEP) * 0.3, -4, K.FOE_CLOSE))), f.v);
  if (r > 60) return len(a) > K.FOE_ACC ? mul(norm(a), K.FOE_ACC) : a;   // far out she comes straight in: jinking is for when a gun can reach her
  if (len(a) > K.FOE_ACC * 0.6) a = mul(norm(a), K.FOE_ACC * 0.6);
  const side = rnd() < 0.75 ? f.bias : -f.bias;                    // she has a habit: three times in four she jinks to the same side
  a = add(a, mul(V(-los.y, los.x), side * K.FOE_ACC * (0.55 + 0.45 * rnd())));
  return len(a) > K.FOE_ACC ? mul(norm(a), K.FOE_ACC) : a;
}

// ---------- the crew's own read (for every post you do not hold) ----------
function aiPilot(s) { const a = asked(s, 'pilot'); return a && allows(s, a) ? a : orderOf(s).intent; }
function aiGunner(s, bears) {
  const af = asked(s, 'gunner.fire'), ap = asked(s, 'gunner.pdc');
  const fire = af !== undefined ? af : bears && range(s) < 60 && !(s.me.heat >= K.HEAT_CAP - 1 && s.foe.hull > 20);
  const role = ap === 'threat' || known(s).some(t => eta(s, t) < 1.6) ? 'pd' : 'attack';   // the PDC when a torpedo will reach its range this cycle
  return { fire, pdc: ap || (known(s).length ? 'threat' : 'forward'), role };
}
const aiEngineer = s => asked(s, 'engineer') || ORDER[orderOf(s).intent].power;
function aiComms(s) { return asked(s, 'comms') || ORDER[orderOf(s).intent].comms; }

// ---------- the captain ----------
// The captain sets the intent each turn, by the state of the fight and their nerve. The gunner works the geometry inside it. Pilot, engineer
// and comms carry it out, with a skill check on how well, and suggest changes, which the captain weighs.
const ORDER = {
  engage: { text: 'Close to twelve and work her.', power: 'guns', comms: 'lock' },
  hold: { text: 'Hold at twenty. Trade with her.', power: 'balanced', comms: 'watch' },
  open: { text: 'Open the range.', power: 'drive', comms: 'watch' },
  break: { text: 'Break off. Open it all the way.', power: 'drive', comms: 'spoof' },
  evade: { text: 'Evade. Fish in the water.', power: 'pdc', comms: 'spoof' },
};
const lvl = post => post === UI.post ? UI.level : K.CREW_LVL;
const shares = s => [s.me.hull / 100, s.foe.hull / s.foe.max];
const nerveWord = () => UI.nerve < 0.35 ? 'cautious' : UI.nerve > 0.65 ? 'bold' : 'steady';
function captainPick(s) {
  const n = UI.nerve, [ours, hers] = shares(s);
  if (known(s).some(t => eta(s, t) < 2.5) && !(n > 0.75 && hers < 0.3)) return 'evade';
  if (ours < 0.4 && hers > ours && n < 0.6) return 'break';
  if (hers < ours - 0.2 || n > 0.65) return 'engage';
  if (range(s) < 9 && n < 0.4) return 'open';
  return 'hold';
}
const orderOf = s => s.order || { intent: 'hold' };
function allows(s, a) { const i = orderOf(s).intent; return a === 'nose' ? (i === 'engage' || i === 'hold') : a === 'coast' ? i !== 'evade' : true; }
function evidence(s, intent) { const [ours, hers] = shares(s), torps = known(s).some(t => eta(s, t) < 3);
  return { evade: torps ? 0.3 : -0.2, engage: hers < ours ? 0.2 : -0.05, break: ours < 0.5 ? 0.25 : -0.3, open: torps || range(s) < 12 ? 0.15 : -0.1, hold: 0 }[intent]; }
const nerveFit = intent => { const n = UI.nerve - 0.5; return { engage: n * 0.4, break: -n * 0.4, open: -n * 0.3, evade: 0, hold: 0 }[intent]; };
// Whether the captain takes a suggestion: trust in whoever makes it, their skill, what the board shows, and the captain's nerve.
const takeOdds = (s, post, intent) => clamp(0.2 + 0.35 * (post === UI.post ? UI.trust : 0.7) + 0.07 * lvl(post) + evidence(s, intent) + nerveFit(intent), 0.05, 0.95);
// How well an order is carried out: the odds of each check, by the skill of whoever carries it out.
const engOdds = pushed => clamp((pushed ? 0.45 : 0.6) + 0.08 * lvl('engineer'), 0.05, 0.97);
const commsOdds = mode => mode === 'lock' || mode === 'spoof' ? clamp((mode === 'lock' ? 0.45 : 0.4) + 0.1 * lvl('comms'), 0.05, 0.97) : 1;
const ventOdds = () => clamp(0.5 + 0.1 * lvl('engineer'), 0.05, 0.97);
const scatterDeg = steady => (5 - lvl('pilot')) * 4 * (steady ? 0.5 : 1);
function clampBurn(t, ord) {
  if (ord.thr < 0.1) return { dir: t.dir, thr: Math.min(t.thr, 0.3) };       // a coasting order allows small trims
  const lim = 45 * DEG; if (adiff(t.dir, ord.dir) <= lim) return { ...t };
  return { dir: ord.dir + (Math.sin(t.dir - ord.dir) > 0 ? 1 : -1) * lim, thr: t.thr };
}
const topOf = p => Object.keys(p).reduce((a, b) => p[a] >= p[b] ? a : b);
// The rolls, made when the turn is committed. What they change is kept in s.ov for the turn, and buildOrders reads it.
function rollChecks(s, o) {
  const ov = {}, say = l => s.turnLines.push(l), r = () => s.r2(), P = UI.post;
  const steady = P === 'pilot' && UI.mode === 'B' && s.ui.b.pilot === 'steady';
  if (o.thrust.thr > 0.02) { const g = (r() + r() + r() - 1.5) / 0.5, off = g * scatterDeg(steady) * DEG;
    ov.thrust = { dir: o.thrust.dir + off, thr: clamp(o.thrust.thr * (1 + off * 0.5), 0, 1) };
    if (Math.abs(off) > 8 * DEG) say(`The burn lands ${Math.round(Math.abs(off) / DEG)} degrees off the plot.`); }
  const pushed = P === 'engineer' && s.ui.b.eng === 'push', changed = JSON.stringify(PRESETS[o.engIntent]) !== JSON.stringify(s.lastPower);
  if (changed || pushed) {
    if (r() < engOdds(pushed)) { ov.power = { ...o.power }; s.lastPower = { ...PRESETS[o.engIntent] }; say(pushed ? `Engineer pushes the ${topOf(o.power)} to 4.` : 'Engineer gets the power across in time.'); }
    else if (pushed) { ov.power = { ...o.power }; ov.power[topOf(o.power)] = 1; say(`The breaker trips. The ${topOf(o.power)} drops to 1 this turn.`); }
    else { ov.power = { ...s.lastPower }; say('The switch-over is late. Still on the old split this turn.'); }
  }
  if (commsOdds(o.comms) < 1 && r() >= commsOdds(o.comms)) { ov.comms = 'none'; say(o.comms === 'lock' ? 'Comms cannot hold a lock this turn. Blind past 12 km.' : 'The spoof does not take. Blind past 12 km.'); }
  return ov;
}

// ---------- geometry from an intent ----------
function pilotGeo(s, intent, acc) {

    const read = `<p class="read">${status}<br>Solution ${o.aim ? `${pct(o.solLo)} to ${pct(o.solHi)}%` : 'none'}   spread ${o.R.toFixed(2)} km   her reach ${(0.5 * K.FOE_ACC).toFixed(1)} km<br>Damage ${Math.round(K.GUN_DMG[o.power.guns] * falloff(range(s)))} a hit${falloff(range(s)) < 1 ? ' (cut at this range)' : ''}<br>Heat ${s.me.heat} of ${K.HEAT_CAP}   PDC ${Math.round(o.pdcW)} degrees${o.comms === 'lock' ? '<br><span class="good">Comms has a lock: the spread is tighter and her habit shows.</span>' : ''}</p>`;
    if (A) return `<div class="row"><span class="lab">Tool</span>${seg('tool', [['aim', 'Place the shot'], ['pdc', 'Set PDC arc']], UI.tool)}</div>
      <div class="row"><span class="lab">Fire control</span>${seg('role', [['attack', 'The gun'], ['pd', 'The PDC']], ui.role)}</div>
      <p class="note">For the whole order cycle: the fire control runs the gun or the PDC, never both. Choose the PDC when a torpedo will reach its 9 km this cycle.</p>
      <div class="row"><span class="lab">Gun</span>${seg('afire', [[true, 'Fire'], [false, 'Hold']], ui.fire)}</div>
      <div class="row"><span class="lab">PDC arc</span><input id="pdcw" type="range" min="30" max="160" step="5" value="${ui.pdcW}" aria-label="PDC arc width"><span class="read" id="pdcwv">${ui.pdcW} deg</span></div>
      <p class="note">${UI.tool === 'aim' ? "Click the radar where she will be at the end of the turn. The dashed ring is everywhere her drive can put her. Your ring is where the slug can land: it grows with range and when the ship burns. A slug that lands within 0.7 km of her hits." : 'Click the radar to point the PDC. A narrow arc is dense and kills what is inside it. A wide one covers more and kills less.'}</p>${read}`;
    return `<div class="row"><span class="lab">Fire control</span>${seg('brole', [['attack', 'The gun'], ['pd', 'The PDC']], ui.b.role)}</div>
      <p class="note">For the whole order cycle: the fire control runs the gun or the PDC, never both. Choose the PDC when a torpedo will reach its 9 km this cycle.</p>
      <div class="row"><span class="lab">Gun</span>${seg('bfire', [[true, 'Fire'], [false, 'Hold']], ui.b.fire)}</div>
      <div class="row"><span class="lab">PDC</span>${seg('bpdc', [['forward', 'On her bow'], ['threat', 'On the threat'], ['wide', 'Wide']], ui.b.pdc)}</div>
      <p class="note">The fire control lays the shot on where she will be. You decide whether to fire and where the PDC looks.</p>${read}`;
  }
  if (P === 'pilot') {
    const steady = !A && ui.b.pilot === 'steady';
    const read = `<p class="read">Burn ${Math.round(o.thrust.thr * 100)}%${o.thrust.thr > 0.02 ? `, bearing ${pad3(brg(dirv(o.thrust.dir)))}` : ''}   drive ${o.acc.toFixed(1)} km/turn&sup2;<br>Your level ${UI.level}: the burn lands within about ${Math.round(scatterDeg(steady) * 2)} degrees of the plot (the two rings).<br>${o.bears ? '<span class="good">Nose within 30 degrees of her: the gun bears.</span>' : `<span class="warm">Nose ${offHer(s, o)} degrees off her: the gun won't bear.</span>`}<br>${projWords(s, o)}</p>`;
    if (A) return `<p class="note">Drag on the radar to set the burn, inside the captain's order: ${o.ordered.thr >= 0.1 ? 'the yellow wedge is what the order allows.' : 'the order is to coast, so small trims only, up to 30%.'} A coasting ship can turn her nose to the target; a burning one points where she burns.</p>
      <div class="row"><button data-act="coast">Coast</button><button data-act="asorder">Burn as ordered</button></div>
      <div class="row"><span class="lab">Coasting</span>${seg('face', [['her', 'Turn to her'], ['hold', 'Hold facing']], ui.face)}</div>
      <p class="note">The hull swings 90 degrees a turn. The drive fires only once the nose is within 30 degrees of the burn, so turning round eats into the burn.</p>${read}`;
    return `<div class="row"><span class="lab">Burn</span>${seg('bpilot', [['order', 'As ordered'], ['steady', 'Steady: 60%, half the scatter']], ui.b.pilot)}</div>${read}`;
  }
  if (P === 'engineer') return `<div class="row"><span class="lab">Carry out</span>${seg('beng', [['book', `By the book ${pct(engOdds(false))}%`], ['push', `Push it ${pct(engOdds(true))}%`]], ui.b.eng)}</div>
    <p class="note">The order sets the split. By the book: the power gets across in time, or the old split stays a turn. Push it: the top system runs at 4, or the breaker trips and it drops to 1. By the book only rolls when the split changes.</p>
    <div class="row"><button class="toggle" data-act="vent" aria-pressed="${ui.vent}" ${ventReady(s) ? '' : 'disabled'}>Vent the gun ${pct(ventOdds())}%</button><span class="note">${ventReady(s) ? 'Heat to 0 and the lock off. If it sticks, heat down 2.' : `Ready in ${K.VENT_EVERY - (s.turn - s.me.lastVent)} turns.`}</span></div>
    <p class="read">This turn: drive ${o.power.drive}, gun ${o.power.guns}, PDC ${o.power.pdc}   last turn ${s.lastPower.drive}/${s.lastPower.guns}/${s.lastPower.pdc}<br>Gun heat ${s.me.heat} of ${K.HEAT_CAP}${o.locked ? '  <span class="bad">locked</span>' : ''}</p>`;
  const pref = ORDER[orderOf(s).intent].comms;
  return `<div class="row"><span class="lab">Mode</span>${seg('comms', [['watch', 'Watch 100%'], ['lock', `Lock ${pct(commsOdds('lock'))}%`], ['spoof', `Spoof ${pct(commsOdds('spoof'))}%`]], ui.comms)}</div>
    <p class="note">The captain wants ${COMMS_WORD[pref]}. Watch: the board sees torps at any range and her salvo a turn ahead. Lock: tightens the gun and the board's error on her, and shows her habit. Spoof: her torps steer badly and her gun misses more. Lock and spoof leave you blind past 12 km, and if the roll fails you are blind for nothing.</p>
    <p class="read">${inbound(s).length ? `<span class="warm">${torpWarn(s)}</span>` : 'No torps on the board.'}${s.foe.armed && s.comms === 'watch' ? '<br><span class="bad">She is arming a salvo.</span>' : ''}<br>${projWords(s, o)}</p>`;
}
function turnSummary(s, o) {
  const swing = Math.round(adiff(s.me.nose, o.nose) / DEG), burning = o.thrust.thr > 0.05, p = [];
  p.push(burning ? `Burn ${pct(o.thrust.thr)}% toward ${pad3(brg(dirv(o.thrust.dir)))}` : 'Coast');
  p.push(swing ? `the hull swings ${swing} degrees to face ${pad3(brg(dirv(o.nose)))}` : `the hull stays facing ${pad3(brg(dirv(o.nose)))}`);
  if (burning && adiff(s.me.nose, o.thrust.dir) >= K.GATE) p.push(adiff(o.nose, o.thrust.dir) < K.GATE ? 'the drive lights once the nose comes round' : 'the drive does not light: the nose will not come round this turn');
  p.push(o.role === 'pd' ? 'the fire control runs the PDC, so the gun is silent' : o.canFire ? 'the gun fires' : o.fire ? `the gun cannot fire (${o.locked ? 'heat' : !o.aim ? 'no shot placed' : !o.bears ? 'the nose is off her' : 'no power'})` : 'the gun holds');
  p.push(o.role === 'pd' ? `PDC ${PDC_WORD[o.pdcIntent]}` : 'the PDC is stowed');
  return `<p class="summary"><b>This turn:</b> ${p.join(', ')}.</p>`;
}
// Where an order leaves the nose at the end of this turn, and so whether the bow gun bears on her.
function gunCost(s, intent) {
  const acc = K.ME_ACC * K.DRIVE[PRESETS[ORDER[intent].power].drive], g = pilotGeo(s, intent, acc);
  const want = g.thr > 0.05 ? g.dir : g.face === 'her' ? ang(losMe(s)) : s.me.nose, end = turnToward(s.me.nose, want, K.TURN), off = Math.round(adiff(end, ang(losMe(s))) / DEG);
  return { bears: off <= K.BEAR / DEG, off, burn: g.thr > 0.05 };
}
const gunTag = (s, intent) => { const c = gunCost(s, intent); return c.bears ? ' <span class="good">gun bears</span>' : ' <span class="bad">no gun</span>'; };
function gunWords(s, intent) {
  const c = gunCost(s, intent);
  if (c.bears) return `<span class="good">Flown as ordered, the gun bears this turn${c.burn ? ': the burn is toward her' : ': coasting, nose on her'}.</span>`;
  return `<span class="bad">Flown as ordered, the hull ends ${c.off} degrees off her: no gun this turn.</span>${c.burn ? ' The drive points away from her to do this.' : ''}`;
}
function orderCard(s) {
  const i = orderOf(s).intent, d = ORDER[i], by = s.order && s.order.by;
  return `<p class="read"><span class="p-captain">Captain (${nerveWord()}):</span> ${d.text}${by ? ` <span class="note">On ${by === UI.post ? 'your' : NAME[by] + "'s"} suggestion.</span>` : ''}<br><span class="note">Pilot ${PILOT_WORD[i]}. Engineer feeds ${d.power}. Comms ${COMMS_WORD[d.comms]}.</span><br>${gunWords(s, i)}</p>`;
}
function crewPanel(s, o) {
  const rows = { pilot: `${PILOT_WORD[o.pilotIntent]}: burn ${Math.round(o.thrust.thr * 100)}%, nose ${offHer(s, o)} deg off her`,
    gunner: `${o.fire ? (o.canFire ? `firing, solution ${pct(o.solLo)}-${pct(o.solHi)}%` : "wants to fire, can't") : 'holding fire'}; PDC ${PDC_WORD[o.pdcIntent]}`,
    engineer: `drive ${o.power.drive}, gun ${o.power.guns}, PDC ${o.power.pdc}${o.vent ? ', venting' : ''}`, comms: COMMS_WORD[o.comms] };
  return POSTS.filter(p => p !== UI.post).map(p => `<div><span class="p-${p}">${NAME[p]}</span><span>${rows[p]}</span></div>`).join('');
}
function render() {
  const s = S, o = s.phase === 'plan' ? buildOrders(s) : s.exec.o, P = UI.post, plan = (s.phase === 'plan' || (UI.time === 'real' && s.paused)) && !s.over;
  const strip = s.log.map(e => e.kind === 'event' ? `<div><time>${e.t}</time><span class="ev">${e.text}</span></div>`
    : `<div class="${e.kind === 'reply' ? 'reply' : ''}"><time>${e.kind === 'reply' ? '' : e.t}</time><span><span class="who p-${e.from}">${e.from === P ? 'You' : NAME[e.from]}</span>${e.kind === 'call' ? ` to ${e.to === P ? 'you' : NAME[e.to]}` : ''}: ${e.text}</span></div>`).join('');
  side.innerHTML = `
  <div class="card"><h1>Radar fight spike</h1><p class="sub">Throwaway. The hauler against a corsair with four torpedoes. Same seed in both modes, so you can play it twice and compare.</p>
    <div class="row"><span class="lab">Mode</span>${seg('mode', [['A', 'A: you plot'], ['B', 'B: you order']], UI.mode)}</div>
    <div class="row"><span class="lab">Post</span>${seg('post', POSTS.map(p => [p, NAME[p]]), P)}</div>
    <div class="row"><span class="lab">Time</span>${seg('time', [['turns', 'Turns'], ['real', 'Real time with pause']], UI.time)}</div>
    ${UI.time === 'real' ? `<div class="row"><span class="lab">Speed</span>${seg('speed', [[1, '1x'], [2, '2x'], [16, '16x']], UI.speed)}</div>` : ''}
    <div class="row"><span class="lab">Zoom</span>${seg('zoom', [['auto', 'Auto'], ['50', '50 km'], ['150', '150 km'], ['400', '400 km']], UI.zoom)}</div>
    <details id="setup" ${UI.setupOpen ? 'open' : ''}><summary>Setup: trust, captain, your level, fire control, sensors, seed</summary><div>
    <div class="row"><span class="lab">Trust</span><input id="trust" type="range" min="0" max="1" step="0.05" value="${UI.trust}" aria-label="How much the crew trusts you"><span class="read" id="trustv">${Math.round(UI.trust * 100)}%</span></div>
    <div class="row"><span class="lab">Captain</span><input id="nerve" type="range" min="0" max="1" step="0.05" value="${UI.nerve}" aria-label="The captain's nerve"><span class="read" id="nervev">${nerveWord()}</span></div>
    <div class="row"><span class="lab">Your level</span>${seg('level', [0, 1, 2, 3, 4, 5].map(n => [n, String(n)]), UI.level)}<span class="note">the crew are 2</span></div>
    <div class="row"><span class="lab">Opening</span>${seg('opening', [['long', 'Long: met at 250 km'], ['short', 'Short: met at 40 km']], UI.opening)}</div>
    <div class="row"><span class="lab">Accuracy</span>${seg('acc', [[false, 'Stock'], [true, 'Upgraded']], UI.accurate)}</div>
    <div class="row"><span class="lab">Resilience</span>${seg('hard', [[false, 'Stock'], [true, 'Hardened']], UI.hardened)}</div>
    <div class="row"><span class="lab">Sensors</span><input id="sens" type="range" min="20" max="100" step="5" value="${UI.sensors}" aria-label="Sensor condition"><span class="read" id="sensv">${UI.sensors}%</span></div>
    <p class="note">Every ship sees the whole fight, with error: the red bands are where she really is, and they widen the further ahead the board looks. Accuracy halves the error and tightens the gun. Hardened keeps worn sensors from widening it much. A comms lock narrows it on her. Board error now ${sigmaOf(o.comms).toFixed(2)} km.</p>
    <div class="row"><span class="lab">Seed</span><span class="read">${UI.seed}</span><button data-act="restart">Restart</button><button data-act="newseed">New seed</button></div>
    </div></details></div>
  ${s.over ? `<div class="card over"><p style="color:${s.over.win ? 'var(--ok)' : 'var(--hot)'}">${s.over.text}</p><div class="row"><button data-act="restart">Play it again</button><button data-act="flip">Again in ${UI.mode === 'A' ? 'B' : 'A'}</button></div></div>` : ''}
  <div class="card"><h2>Your post: <em>${NAME[P]}</em>${(P === 'engineer' || P === 'comms') ? '   (A and B the same here)' : ''}</h2>${orderCard(s)}${turnSummary(s, o)}${postPanel(s, o)}
    ${UI.time === 'real' ? `${s.paused && s.pauseWhy ? `<p class="read warm">Paused: ${s.pauseWhy}</p>` : ''}<button class="go" data-act="pause" ${s.over ? 'disabled' : ''}>${s.paused || s.phase === 'plan' ? 'Play' : 'Pause'}</button><p class="note"><kbd>Space</kbd> plays and pauses. The burn and the PDC change at once; power, comms and the next shot at the next order cycle, ${clock(s.phase === 'exec' ? s.turn + 1 : s.turn)}.</p>` : `<button class="go" data-act="go" ${plan ? '' : 'disabled'}>${s.phase === 'exec' ? 'Burning...' : 'End turn'}</button><p class="note">Or press <kbd>Space</kbd>.</p>`}</div>
  <div class="card"><h2>${clock(s.turn)}   turn ${s.turn + 1} of ${K.TURNS}</h2>
    <div class="bars"><span>Our hull</span><span class="bar"><i style="width:${s.me.hull}%"></i></span><span>${s.me.hull}</span>
    <span>Her hull</span><span class="bar foe"><i style="width:${s.foe.hull / s.foe.max * 100}%"></i></span><span>${s.foe.hull}</span>
    <span>Gun heat</span>${pips(s.me.heat, K.HEAT_CAP, s.me.heat >= K.HEAT_CAP - 1 ? 'over' : 'on')}<span>${s.me.heat}</span>
    <span>Her torps</span>${pips(s.foe.torps, 4, 'over')}<span>${s.foe.torps}</span></div></div>
  ${s.incoming.length ? `<div class="card incoming"><h2>Calls to you</h2>${s.incoming.map((m, i) => `<div class="msg"><p><span class="who p-${m.from}">${NAME[m.from]}</span>: ${m.text}</p><div class="row">${m.suggest ? `<button data-act="ans" data-i="${i}" data-y="1">Do it</button><button data-act="ans" data-i="${i}" data-y="0">No</button>` : `<button data-act="ans" data-i="${i}" data-y="0">Heard</button>`}</div></div>`).join('')}</div>` : ''}
  <div class="card"><h2>Your calls</h2><div class="acts">${CALLS[P].map(c => `<button data-act="call" data-id="${c.id}" ${!plan || s.used[c.id] || (c.avail && !c.avail(s)) ? 'disabled' : ''}>${c.label} <span class="p-${c.to === 'all' ? 'ship' : c.to}">to ${NAME[c.to]}</span>${c.to === 'captain' ? ` ${pct(takeOdds(s, P, c.intent))}%${gunTag(s, c.intent)}` : ''}</button>`).join('')}</div>
    <p class="note">One of each a turn. ${P === 'gunner' ? 'The posts weigh it against the captain\'s order and how far they trust you.' : 'A suggestion to the captain shows its odds: your trust, your level, what the board shows, and the captain\'s nerve.'}</p></div>
  <div class="card"><h2>The crew this turn</h2><div class="crew">${crewPanel(s, o)}</div></div>
  <div class="card"><h2>Net</h2><div class="strip">${strip || '<span class="ev">Quiet.</span>'}</div></div>
  <div class="card"><h2>What to judge</h2><ul class="q"><li>A against B: is plotting on the radar more fun, or just more work?</li><li>At a post without the gun, is there still a fight to play?</li><li>Do the calls make a crew, or are they menu chores?</li></ul></div>`;
}

side.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const s = S, ui = s.ui, v = b.dataset.v, act = b.dataset.act, bool = v === 'true';
  if (act === 'mode') { UI.mode = v; }
  else if (act === 'acc') UI.accurate = bool;
  else if (act === 'level') UI.level = +v;
  else if (act === 'asorder') ui.thrust = { ...buildOrders(s).ordered };
  else if (act === 'hard') UI.hardened = bool;
  else if (act === 'post') { UI.post = v; s.incoming = []; }
  else if (act === 'pause') return playPause();
  else if (act === 'time') { UI.time = v; S.paused = false; S.pauseWhy = ''; }
  else if (act === 'speed') UI.speed = +v;
  else if (act === 'zoom') UI.zoom = v;
  else if (act === 'opening') { UI.opening = v; S = newGame(UI.seed); aiCalls(S); }
  else if (act === 'restart') { S = newGame(UI.seed); aiCalls(S); }
  else if (act === 'newseed') { UI.seed = 1 + Math.floor(Math.random() * 9999); S = newGame(UI.seed); aiCalls(S); }
  else if (act === 'flip') { UI.mode = UI.mode === 'A' ? 'B' : 'A'; S = newGame(UI.seed); aiCalls(S); }
  else if (act === 'go') return commit();
  else if (act === 'tool') UI.tool = v;
  else if (act === 'afire') ui.fire = bool;
  else if (act === 'role') ui.role = v;
  else if (act === 'brole') ui.b.role = v;
  else if (act === 'bfire') ui.b.fire = bool;
  else if (act === 'bpdc') ui.b.pdc = v;
  else if (act === 'bpilot') ui.b.pilot = v;
  else if (act === 'beng') ui.b.eng = v;
  else if (act === 'comms') { ui.comms = v; ui.b.comms = v; }
  else if (act === 'coast') { ui.thrust = { dir: s.me.nose, thr: 0 }; ui.face = 'hold'; }
  else if (act === 'face') ui.face = v;
  else if (act === 'nosefoe') { ui.thrust = { dir: ang(losMe(s)), thr: 0 }; ui.face = 'her'; }
  else if (act === 'vent') ui.vent = !ui.vent;
  else if (act === 'pw') { const k = b.dataset.k, d = +b.dataset.d, used = ui.power.drive + ui.power.guns + ui.power.pdc; const n = ui.power[k] + d; if (n >= 0 && n <= 3 && (d < 0 || used < 6)) ui.power[k] = n; }
  else if (act === 'call') return playerCall(b.dataset.id);
  else if (act === 'ans') return answer(+b.dataset.i, b.dataset.y === '1');
  render();
});
side.addEventListener('input', e => {
  if (e.target.id === 'trust') { UI.trust = +e.target.value; document.getElementById('trustv').textContent = `${Math.round(UI.trust * 100)}%`; }
  if (e.target.id === 'nerve') { UI.nerve = +e.target.value; document.getElementById('nervev').textContent = nerveWord(); }
  if (e.target.id === 'sens') { UI.sensors = +e.target.value; document.getElementById('sensv').textContent = `${UI.sensors}%`; }
  if (e.target.id === 'pdcw') { S.ui.pdcW = +e.target.value; if (S.phase === 'exec') S.exec.o.pdcW = S.ui.pdcW; document.getElementById('pdcwv').textContent = `${S.ui.pdcW} deg`; }
});
side.addEventListener('toggle', e => { if (e.target.id === 'setup') UI.setupOpen = e.target.open; }, true);
side.addEventListener('change', e => { if (e.target.id === 'pdcw' || e.target.id === 'sens') render(); if (e.target.id === 'nerve') { if (S.phase === 'plan' && !S.over && !(S.order && S.order.by)) S.order = { intent: captainPick(S), until: -1 }; render(); } });
document.addEventListener('keydown', e => { if (e.code === 'Space' && !['BUTTON', 'INPUT'].includes(e.target.tagName)) { e.preventDefault(); if (UI.time === 'real') playPause(); else commit(); } });

S = newGame(UI.seed); aiCalls(S); render(); requestAnimationFrame(draw);
</script>
</body>
